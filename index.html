/* Patch 2 — Resource Hopper / Library */

:root{--intro-bg:#000;--bg:#000}
[data-theme^="light-"]{--intro-bg:#fff;--bg:#fff}
.welcome-intro{position:fixed;inset:0;z-index:2000;background:var(--intro-bg);display:grid;place-items:center;cursor:pointer;transition:opacity .45s ease;touch-action:manipulation}
.laser-stage{width:min(84vw,460px);color:var(--accent)}
.laser-stage svg{display:block;width:100%;overflow:visible}
.laser-letter{fill:transparent;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:laser-draw .55s ease-out var(--letter-delay) forwards,laser-fill .35s ease calc(var(--letter-delay) + .4s) forwards;filter:drop-shadow(0 0 3px currentColor)}
.laser-frame{fill:none;stroke:currentColor;stroke-width:1.7;stroke-dasharray:1;stroke-dashoffset:1;animation:laser-draw .45s ease 1.55s forwards,led-glow .55s ease 2s forwards}
.laser-stage{animation:laser-exit .35s ease 2.7s forwards}
.intro-skip{position:absolute;bottom:max(32px,env(safe-area-inset-bottom));font-size:11px;color:var(--muted);letter-spacing:.05em}
@keyframes laser-draw{to{stroke-dashoffset:0}}
@keyframes laser-fill{to{fill:currentColor;stroke-width:.4}}
@keyframes led-glow{to{filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 0 10px currentColor)}}
@keyframes laser-exit{to{opacity:0;filter:blur(3px)}}
body.intro-running .app{opacity:0;pointer-events:none}
.app{transition:opacity .5s ease}
.dashboard-date{color:var(--muted);font-size:11px;margin:8px 0 0;letter-spacing:.05em}

.continue-study strong,.continue-study small{display:block}

(function(){
  const intro=document.getElementById('welcomeIntro');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){intro.remove();return;}
  const app=document.querySelector('.app');app.inert=true;
  document.body.classList.add('intro-running');
  let done=false;
  function finish(){
    if(done)return;done=true;
    intro.style.opacity='0';
    document.body.classList.remove('intro-running');app.inert=false;
    setTimeout(()=>{intro.remove();document.dispatchEvent(new Event('nursehub-intro-finished'));},460);
  }
  intro.addEventListener('click',finish);
  intro.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '||e.key==='Escape'){e.preventDefault();finish();}});
  setTimeout(finish,4300);
})();
</script>

async function decodeObjectiveData(){
  const bytes=Uint8Array.from(atob(objectiveDataCompressed),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  const text=await new Response(stream).text();
  return JSON.parse(text);
}

async function init(){
  function getLocalTheme(){
    try{return localStorage.getItem('nurseHubTheme')||'dark-default';}
    catch(e){return 'dark-default';}
  }
  function applyLocalTheme(theme){
    const allowed=['dark-default','dark-cyan','dark-pink','dark-green','dark-purple','dark-orange','dark-blue','dark-red','dark-yellow','light-default','light-cyan','light-pink','light-green','light-purple','light-orange','light-blue','light-red','light-yellow'];
    const next=allowed.includes(theme)?theme:'dark-default';
    document.documentElement.dataset.theme=next;
    try{localStorage.setItem('nurseHubTheme',next);}catch(e){}
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute('content',next.startsWith('light-')?'#FFFFFF':'#000000');
  }
  function getThemeMode(){return getLocalTheme().startsWith('light-')?'light':'dark';}
  function getThemeAccent(){const theme=getLocalTheme();return theme.substring(theme.indexOf('-')+1);}
  try{applyLocalTheme(getLocalTheme());}catch(e){document.documentElement.dataset.theme='dark-default';}
  objectiveData=await decodeObjectiveData();

    {id:'respiratory-rate',name:'Respiratory Rate',abbr:'RR',range:'12–20/min',unit:'/min',why:'Reflects ventilation and respiratory effort and is an early indicator of clinical deterioration.',low:{label:'Too low',info:'Bradypnea can occur with CNS depression, opioid or sedative effects, neurologic impairment, or severe fatigue.',risks:['Hypoventilation, hypercapnia, hypoxemia, respiratory arrest.'],causes:['Opioids/sedatives','Neurologic impairment','Severe fatigue','Sleep-related or metabolic causes'],meds:['Opioids and sedatives are common medication-related causes.'],care:['Assess airway, depth and effort, SpO₂, level of consciousness, and trends.','Stimulate and support ventilation as indicated; follow emergency protocols for severe depression.'],contra:'Do not rely on SpO₂ alone to rule out hypoventilation, especially when supplemental oxygen is being given.'},high:{label:'Too high',info:'Tachypnea may reflect hypoxemia, metabolic acidosis, fever, pain, anxiety, or increased respiratory demand.',risks:['Respiratory fatigue, worsening gas exchange, and deterioration when the underlying cause is severe.'],causes:['Hypoxemia','Fever','Pain/anxiety','Metabolic acidosis','Pulmonary disease'],meds:['Some stimulants and medications may increase respiratory drive; treatment depends on cause.'],care:['Assess work of breathing, oxygenation, lung sounds, and mental status.','Look for the underlying cause and escalate for distress or rapid deterioration.'],contra:'Do not dismiss persistent tachypnea as anxiety without assessment.'}},
    {id:'blood-pressure',name:'Blood Pressure',abbr:'BP',range:'90–130/60–80 mmHg',unit:'mmHg',why:'Reflects arterial pressure and provides information about perfusion and cardiovascular status.',low:{label:'Too low',info:'Hypotension can indicate volume loss, vasodilation, medication effects, cardiac dysfunction, or other causes of impaired perfusion.',risks:['Dizziness, syncope, kidney injury, shock, and inadequate organ perfusion.'],causes:['Dehydration/hemorrhage','Sepsis or vasodilation','Antihypertensives','Cardiac dysfunction','Orthostatic changes'],meds:['Diuretics, antihypertensives, vasodilators, and some sedating medications may lower BP.'],care:['Assess symptoms and perfusion; recheck using correct technique.','Review medications and fluid status.','Escalate promptly for symptomatic or severe hypotension.'],contra:'Avoid assuming a low reading is abnormal for every patient; compare with baseline and symptoms.'},high:{label:'Too high',info:'Hypertension increases vascular workload and long-term cardiovascular, renal, and neurologic risk.',risks:['Stroke, myocardial injury, kidney disease, and other end-organ damage when persistent or severe.'],causes:['Chronic hypertension','Pain/stress','Kidney disease','Fluid retention','Certain medications or stimulants'],meds:['NSAIDs, stimulants, decongestants, corticosteroids, and some hormonal therapies can raise BP.'],care:['Repeat an unexpectedly high reading with proper technique.','Assess symptoms and medication adherence.','Urgently escalate severe BP with signs of end-organ injury.'],contra:'Do not rapidly lower BP without an appropriate clinical indication; the target depends on the patient and situation.'}},
    {id:'spo2',name:'Oxygen Saturation',abbr:'SpO₂',range:'Generally ≥95%',unit:'%',why:'Estimates arterial oxygen saturation and helps assess oxygenation when interpreted with the clinical picture.',low:{label:'Too low',info:'Low SpO₂ may indicate impaired oxygenation from pulmonary, cardiac, airway, or other causes.',risks:['Hypoxemia, tissue hypoxia, respiratory distress, dysrhythmias, and organ injury when severe or prolonged.'],causes:['Pneumonia','Asthma/COPD exacerbation','Pulmonary edema','Airway obstruction','Hypoventilation'],meds:['Opioids and sedatives may worsen hypoventilation; respiratory treatments depend on the cause.'],care:['Verify probe placement and signal quality.','Assess work of breathing and mental status.','Apply oxygen or other ordered support and escalate persistent/severe hypoxemia.'],contra:'Pulse oximetry can be affected by poor perfusion, motion, nail products, skin temperature, and other factors; correlate with the patient.'},high:{label:'Higher than expected',info:'SpO₂ above the expected physiologic range is usually not treated as a disease finding; clinical concern is generally about unnecessary oxygen administration in patients who do not need it.',risks:['Excess oxygen can be harmful in selected patients or circumstances.'],causes:['Supplemental oxygen above the patient’s target','Measurement variation'],meds:['Not usually medication-driven; oxygen is a therapy rather than a medication.'],care:['Use the prescribed oxygen target and reassess the need for supplemental oxygen.'],contra:'Do not use a generic target for every patient; some conditions have individualized oxygen targets.'}}

  electrolyte:[
    {id:'sodium',name:'Sodium',abbr:'Na⁺',range:'135–145 mEq/L',unit:'mEq/L',why:'Major extracellular cation involved in fluid balance, nerve impulses, and muscle function.',low:{label:'Too low — Hyponatremia',info:'Low sodium usually reflects excess free water relative to sodium or sodium loss.',risks:['Headache, confusion, seizures, cerebral edema, and neurologic deterioration when severe or rapidly developing.'],causes:['Excess free water','Diuretics','GI losses','SIADH','Heart, liver, or kidney disorders'],meds:['Thiazide diuretics and some antidepressants or antiseizure medications can contribute.'],care:['Assess neurologic status, fluid balance, and trend.','Treat the cause and follow ordered fluid restriction or sodium replacement.','Correct carefully; overly rapid correction can cause serious neurologic injury.'],contra:'Avoid rapid correction unless specifically directed by the treatment plan.'},high:{label:'Too high — Hypernatremia',info:'High sodium usually reflects a water deficit relative to sodium.',risks:['Thirst, weakness, confusion, seizures, and neurologic injury.'],causes:['Water loss/dehydration','Diabetes insipidus','Inadequate access to water','Excess sodium administration'],meds:['Some diuretics and medications affecting ADH can contribute depending on the cause.'],care:['Assess hydration and neurologic status.','Replace free water as ordered and monitor correction closely.'],contra:'Rapid correction can cause cerebral edema; follow the prescribed correction rate.'}},
    {id:'potassium',name:'Potassium',abbr:'K⁺',range:'3.5–5.0 mEq/L',unit:'mEq/L',why:'Major intracellular cation essential for membrane potentials, skeletal and cardiac muscle contraction, and nerve function.',low:{label:'Too low — Hypokalemia',info:'Low potassium increases neuromuscular and cardiac excitability problems and can impair cardiac repolarization.',risks:['Muscle weakness, ileus, ECG changes, ventricular dysrhythmias, and increased risk of digoxin toxicity.'],causes:['Loop/thiazide diuretics','GI losses','Poor intake','Insulin shifts','Alkalosis'],meds:['Furosemide and other potassium-wasting diuretics; insulin can shift potassium into cells.'],care:['Monitor ECG and potassium trend when significant.','Assess renal function before replacement.','Administer oral or IV replacement exactly as ordered; IV potassium requires dilution and controlled administration.'],contra:'Never give IV potassium by IV push. Use caution with renal impairment.'},high:{label:'Too high — Hyperkalemia',info:'High potassium can rapidly affect cardiac conduction and is potentially life-threatening.',risks:['Peaked T waves, conduction abnormalities, ventricular dysrhythmias, cardiac arrest, muscle weakness.'],causes:['Kidney failure','ACE inhibitors/ARBs','Potassium-sparing diuretics','Tissue breakdown','Acidosis','Excess potassium intake/replacement'],meds:['ACE inhibitors, ARBs, spironolactone, potassium supplements, and some NSAIDs can contribute.'],care:['Obtain/review ECG and repeat potassium when clinically appropriate.','Assess renal function and medications.','Prepare ordered emergency therapies such as calcium, insulin/dextrose, beta agonists, or potassium removal strategies depending on severity.'],contra:'Do not administer potassium replacement when potassium is elevated unless specifically ordered for a compelling reason.'}},
    {id:'chloride',name:'Chloride',abbr:'Cl⁻',range:'95–106 mEq/L',unit:'mEq/L',why:'Major extracellular anion that helps maintain osmotic balance and acid-base status.',low:{label:'Too low — Hypochloremia',info:'Low chloride often accompanies vomiting, gastric losses, metabolic alkalosis, or dilutional states.',risks:['Weakness, dehydration, and acid-base disturbances.'],causes:['Vomiting/NG suction','Diuretics','Excess water','Metabolic alkalosis'],meds:['Loop and thiazide diuretics can lower chloride.'],care:['Assess volume status and acid-base pattern.','Replace fluids/electrolytes and address the underlying cause as ordered.'],contra:'Interpret with sodium, potassium, bicarbonate, and clinical context.'},high:{label:'Too high — Hyperchloremia',info:'High chloride may occur with dehydration, excess chloride administration, or metabolic acidosis.',risks:['Acid-base disturbance and dehydration-related complications.'],causes:['Dehydration','Large-volume normal saline administration','Renal disorders','Metabolic acidosis'],meds:['Chloride-containing IV fluids can contribute.'],care:['Review fluid intake and acid-base status; address the underlying cause.'],contra:'Do not interpret chloride in isolation.'}},
    {id:'calcium',name:'Calcium',abbr:'Ca²⁺',range:'~8.5–10.2 mg/dL',unit:'mg/dL',why:'Essential for bone structure, muscle contraction, nerve transmission, and blood coagulation.',low:{label:'Too low — Hypocalcemia',info:'Low calcium increases neuromuscular irritability and can affect cardiac conduction.',risks:['Tetany, paresthesias, seizures, prolonged QT, and dysrhythmias.'],causes:['Hypoparathyroidism','Vitamin D deficiency','Kidney disease','Pancreatitis','Low magnesium'],meds:['Some anticonvulsants and other medications can contribute.'],care:['Assess neuromuscular symptoms and ECG when significant.','Check related magnesium and albumin as ordered.','Administer calcium replacement as prescribed.'],contra:'IV calcium requires careful administration and monitoring; verify formulation and route.'},high:{label:'Too high — Hypercalcemia',info:'High calcium can reduce neuromuscular excitability and impair renal, GI, and cardiac function.',risks:['Weakness, constipation, kidney stones, dehydration, confusion, shortened QT, dysrhythmias.'],causes:['Hyperparathyroidism','Malignancy','Excess calcium/vitamin D','Prolonged immobilization'],meds:['Thiazides can raise calcium; excessive calcium/vitamin D supplementation can contribute.'],care:['Assess hydration, renal function, ECG, and neurologic status.','Treat the underlying cause and administer ordered fluids/medications.'],contra:'Use caution with calcium-containing medications or supplements when calcium is elevated.'}},
    {id:'magnesium',name:'Magnesium',abbr:'Mg²⁺',range:'~1.5–2.0 mEq/L*',unit:'mEq/L',why:'Supports neuromuscular function, cardiac rhythm, enzyme activity, and potassium/calcium balance.',low:{label:'Too low — Hypomagnesemia',info:'Low magnesium can cause neuromuscular irritability and make hypokalemia or hypocalcemia harder to correct.',risks:['Tremors, weakness, seizures, prolonged QT, torsades de pointes, and other dysrhythmias.'],causes:['Poor intake','Diarrhea/GI loss','Alcohol use disorder','Diuretics','Malabsorption'],meds:['Loop and thiazide diuretics and some other medications can lower magnesium.'],care:['Monitor ECG and related electrolytes when significant.','Replace magnesium as ordered and monitor renal function.'],contra:'Use caution with replacement in renal impairment; follow formulation-specific administration limits.'},high:{label:'Too high — Hypermagnesemia',info:'High magnesium is most often associated with impaired renal excretion or excessive magnesium administration.',risks:['Hypotension, bradycardia, diminished reflexes, respiratory depression, and cardiac arrest when severe.'],causes:['Kidney failure','Excess magnesium-containing medications/antacids/laxatives','Excess IV magnesium'],meds:['Magnesium-containing products and IV magnesium can cause elevation.'],care:['Monitor BP, respiratory status, reflexes, and cardiac rhythm.','Stop/reassess magnesium sources as ordered and prepare supportive or antidotal therapy when severe.'],contra:'Avoid excess magnesium in significant renal impairment unless specifically indicated and closely monitored.'}},
    {id:'phosphorus',name:'Phosphorus',abbr:'',range:'3.0–4.5 mg/dL',unit:'mg/dL',why:'Important for ATP energy metabolism, bone mineralization, and cellular function.',low:{label:'Too low — Hypophosphatemia',info:'Low phosphorus can impair cellular energy production and muscle function.',risks:['Weakness, respiratory muscle weakness, altered mental status, and impaired cellular function when severe.'],causes:['Malnutrition/refeeding','Hyperparathyroidism','Alcohol use disorder','Certain antacids'],meds:['Phosphate-binding antacids and some diuretics can contribute.'],care:['Assess nutrition and related electrolytes.','Replace phosphate as ordered and monitor calcium/renal function.'],contra:'Replacement requires caution in renal impairment and abnormal calcium levels.'},high:{label:'Too high — Hyperphosphatemia',info:'High phosphorus is commonly associated with reduced renal excretion.',risks:['Hypocalcemia, soft-tissue calcification, and renal/bone complications.'],causes:['Kidney failure','Cell breakdown','Excess phosphate intake'],meds:['Phosphate-containing products can contribute.'],care:['Assess renal function and calcium.','Follow prescribed dietary restrictions or phosphate binders.'],contra:'Avoid unnecessary phosphate-containing medications/supplements in patients at risk.'}}

  metabolic:[
    {id:'glucose',name:'Glucose',abbr:'',range:'~65–110 mg/dL',unit:'mg/dL',why:'Primary circulating fuel and a key marker for glucose regulation and diabetes management.',low:{label:'Too low — Hypoglycemia',info:'Low glucose deprives the brain of its primary fuel and can become rapidly life-threatening.',risks:['Sweating, tremor, confusion, seizure, loss of consciousness, and brain injury.'],causes:['Insulin or sulfonylureas','Missed meals','Excess exercise','Sepsis or severe illness'],meds:['Insulin and sulfonylureas are common medication-related causes.'],care:['Check symptoms and glucose promptly.','Give rapid carbohydrate or ordered IV/IM therapy based on severity and ability to swallow.','Recheck glucose and identify the cause.'],contra:'Do not give oral intake to an unconscious or unsafe-to-swallow patient.'},high:{label:'Too high — Hyperglycemia',info:'High glucose may reflect diabetes, stress response, infection, steroids, or inadequate insulin activity.',risks:['Dehydration, electrolyte shifts, DKA/HHS, impaired healing, and infection risk.'],causes:['Diabetes','Stress/illness','Steroids','Inadequate insulin'],meds:['Corticosteroids and some other medications can increase glucose.'],care:['Trend glucose and assess hydration and symptoms.','Administer ordered insulin and monitor potassium when indicated.'],contra:'Insulin dosing must follow the ordered regimen and current glucose/clinical status.'}},
    {id:'bun',name:'Blood Urea Nitrogen',abbr:'BUN',range:'~6–24 mg/dL',unit:'mg/dL',why:'Measures urea nitrogen and provides information about renal excretion, hydration, and protein metabolism.',low:{label:'Too low',info:'Low BUN can occur with low protein intake, liver dysfunction, or overhydration.',risks:['Usually reflects an underlying condition rather than causing symptoms itself.'],causes:['Low protein intake','Liver dysfunction','Overhydration'],meds:['Not typically medication-specific; interpret with liver and nutritional status.'],care:['Assess nutrition, hydration, and other renal/liver markers.'],contra:'Do not interpret BUN alone as proof of renal function.'},high:{label:'Too high',info:'High BUN can result from reduced renal clearance, dehydration, increased protein breakdown, or GI bleeding.',risks:['May accompany azotemia, dehydration, or impaired renal function.'],causes:['Dehydration','Kidney dysfunction','GI bleeding','High protein catabolism'],meds:['Some medications can affect renal function or BUN indirectly.'],care:['Assess hydration, urine output, creatinine, and clinical context.'],contra:'BUN can rise without intrinsic kidney failure; interpret with creatinine and the patient picture.'}},
    {id:'creatinine',name:'Creatinine',abbr:'',range:'~0.6–1.3 mg/dL',unit:'mg/dL',why:'A waste product used as a marker of kidney filtration and a key value for medication dosing.',low:{label:'Too low',info:'Low creatinine often reflects lower muscle mass or other non-renal factors.',risks:['Usually not an acute problem by itself, but may affect interpretation of estimated kidney function.'],causes:['Low muscle mass','Malnutrition','Some chronic conditions'],meds:['Not usually medication-driven.'],care:['Interpret with muscle mass, eGFR, and the broader renal picture.'],contra:'Do not assume low creatinine means hyperfiltration or excellent renal function.'},high:{label:'Too high',info:'Elevated creatinine can indicate reduced kidney filtration or acute kidney injury, although context matters.',risks:['Drug accumulation, electrolyte disturbances, fluid imbalance, and progression of kidney injury.'],causes:['Acute/chronic kidney disease','Dehydration','Nephrotoxic injury','Urinary obstruction'],meds:['NSAIDs and other nephrotoxic drugs can contribute; many medications require renal dose adjustment.'],care:['Trend values and urine output.','Review nephrotoxic medications and renal dosing.','Monitor electrolytes and fluid status.'],contra:'Do not assume a single elevated result identifies the cause; compare with baseline and trend.'}},
    {id:'egfr',name:'Estimated Glomerular Filtration Rate',abbr:'eGFR',range:'>60 mL/min/1.73 m²',unit:'mL/min/1.73 m²',why:'Estimates kidney filtration and helps stage chronic kidney disease and guide medication dosing.',low:{label:'Too low',info:'Lower eGFR suggests reduced kidney filtration; persistent reduction may indicate chronic kidney disease.',risks:['Medication accumulation, electrolyte/acid-base abnormalities, anemia, fluid imbalance, and progressive kidney disease.'],causes:['Chronic kidney disease','Acute kidney injury','Diabetes/hypertension-related kidney disease'],meds:['Many medications require renal dose adjustment as kidney function declines.'],care:['Trend renal function, urine output, electrolytes, and medication dosing.','Monitor for nephrotoxic exposures and coordinate ordered renal care.'],contra:'eGFR is an estimate and may be less reliable in some acute or unusual clinical situations.'},high:{label:'Higher than expected',info:'A higher eGFR generally indicates preserved filtration; isolated high values are not usually treated as a disease.',risks:['No specific risk from the number alone; interpretation depends on the patient and equation.'],causes:['Normal variation','Physiologic differences','Hyperfiltration in some conditions'],meds:['Not typically medication-driven.'],care:['Interpret alongside creatinine, urine findings, and clinical context.'],contra:'Do not use eGFR alone to make a diagnosis.'}},
    {id:'co2',name:'Carbon Dioxide / Bicarbonate',abbr:'CO₂/HCO₃⁻',range:'23–29 mEq/L',unit:'mEq/L',why:'Primarily reflects bicarbonate concentration and provides important information about metabolic acid-base balance.',low:{label:'Too low',info:'Low bicarbonate may indicate metabolic acidosis or compensation for respiratory alkalosis.',risks:['Decreased cardiac contractility, dysrhythmias, altered mental status, and respiratory compensation depending on cause.'],causes:['Diabetic ketoacidosis','Lactic acidosis','Renal failure','GI bicarbonate loss'],meds:['Some medications can contribute indirectly through renal or GI effects.'],care:['Interpret with pH, PaCO₂, anion gap, glucose, lactate, and clinical context when available.','Treat the underlying cause.'],contra:'Do not administer bicarbonate routinely without identifying the cause and clinical indication.'},high:{label:'Too high',info:'High bicarbonate may indicate metabolic alkalosis or compensation for chronic respiratory acidosis.',risks:['Weakness, dysrhythmias, altered mental status, and electrolyte shifts.'],causes:['Vomiting/NG suction','Diuretics','Excess alkali','Chronic CO₂ retention with compensation'],meds:['Diuretics can contribute to metabolic alkalosis.'],care:['Assess volume status, potassium/chloride, respiratory status, and cause.'],contra:'Interpret with blood gas data and the overall acid-base picture.'}}

  cbc:[
    {id:'wbc',name:'White Blood Cells',abbr:'WBC',range:'5,000–10,000/mm³',unit:'/mm³',why:'WBCs are immune cells that help defend against infection and respond to inflammation.',low:{label:'Too low — Leukopenia',info:'Low WBC count can reduce the body’s ability to respond to infection.',risks:['Increased infection risk, especially when neutrophils are significantly reduced.'],causes:['Chemotherapy','Bone marrow disorders','Viral illness','Some medications'],meds:['Chemotherapy and selected drugs can suppress white-cell production.'],care:['Monitor for fever and infection signs.','Use ordered infection precautions and review differential/neutrophil count when available.'],contra:'Fever in a significantly immunocompromised patient can require urgent evaluation.'},high:{label:'Too high — Leukocytosis',info:'High WBC count commonly reflects infection, inflammation, stress, or medication effects.',risks:['Usually reflects an underlying process rather than causing symptoms itself.'],causes:['Infection','Inflammation','Stress','Steroids','Tissue injury'],meds:['Corticosteroids can increase WBC count through demargination.'],care:['Assess for infection or inflammatory signs and trend the count.'],contra:'WBC elevation alone does not diagnose bacterial infection.'}},
    {id:'platelets',name:'Platelets',abbr:'',range:'150,000–400,000/mm³',unit:'/mm³',why:'Platelets are essential for primary hemostasis and formation of the initial platelet plug.',low:{label:'Too low — Thrombocytopenia',info:'Low platelets increase bleeding risk, particularly as the count falls further.',risks:['Petechiae, bruising, mucosal bleeding, GI/intracranial hemorrhage when severe.'],causes:['Bone marrow suppression','Immune destruction','Sepsis','Medications','Consumption disorders'],meds:['Heparin can cause HIT; chemotherapy and other drugs can suppress platelets.'],care:['Assess bleeding and trends.','Use bleeding precautions when indicated and review medications/procedures.','For suspected HIT, notify the provider promptly and follow protocol.'],contra:'Avoid unnecessary IM injections or invasive procedures when bleeding risk is significant.'},high:{label:'Too high — Thrombocytosis',info:'High platelets may be reactive to inflammation, iron deficiency, bleeding, or a myeloproliferative disorder.',risks:['Thrombosis and, in some disorders, bleeding.'],causes:['Inflammation','Iron deficiency','Post-surgical states','Myeloproliferative disorders'],meds:['Usually secondary to another process rather than a direct medication effect.'],care:['Assess thrombotic/bleeding symptoms and underlying cause.'],contra:'Do not assume high platelets automatically mean the patient needs antiplatelet therapy.'}},
    {id:'hemoglobin',name:'Hemoglobin',abbr:'Hgb',range:'Male ~13–18 g/dL · Female ~12–16 g/dL',unit:'g/dL',why:'Hemoglobin carries oxygen from the lungs to tissues and helps transport carbon dioxide back to the lungs.',low:{label:'Too low — Anemia',info:'Low hemoglobin reduces oxygen-carrying capacity.',risks:['Fatigue, dyspnea, tachycardia, dizziness, tissue hypoxia, and reduced activity tolerance.'],causes:['Blood loss','Iron/B12/folate deficiency','Chronic disease','Hemolysis','Bone marrow disorders'],meds:['Anticoagulants can contribute to bleeding; some therapies can suppress marrow.'],care:['Assess symptoms, bleeding, trends, and underlying cause.','Monitor hemodynamics and administer ordered replacement/therapy.'],contra:'Transfusion decisions depend on symptoms, trend, comorbidities, and provider/facility thresholds.'},high:{label:'Too high',info:'Elevated hemoglobin may reflect increased red-cell mass or hemoconcentration.',risks:['Increased blood viscosity and thrombosis risk in significant erythrocytosis.'],causes:['Dehydration','Chronic hypoxia','Smoking','Polycythemia'],meds:['Usually not medication-driven; some hormone therapies can contribute.'],care:['Assess hydration, oxygenation, and underlying cause.'],contra:'Do not interpret elevation without considering fluid status and oxygenation.'}},
    {id:'hematocrit',name:'Hematocrit',abbr:'Hct',range:'Male ~40–55% · Female ~36–48%',unit:'%',why:'Hematocrit represents the percentage of blood volume occupied by red blood cells.',low:{label:'Too low',info:'Low hematocrit commonly accompanies anemia or blood loss.',risks:['Reduced oxygen-carrying capacity, fatigue, weakness, and tissue hypoxia.'],causes:['Blood loss','Anemia','Overhydration','Nutritional deficiency'],meds:['Medications that cause bleeding can contribute indirectly.'],care:['Trend with hemoglobin and clinical symptoms; assess for bleeding and volume status.'],contra:'Interpret alongside hemoglobin and patient status rather than alone.'},high:{label:'Too high',info:'High hematocrit can reflect hemoconcentration or increased red-cell mass.',risks:['Increased viscosity and thrombosis risk when significantly elevated.'],causes:['Dehydration','Chronic hypoxia','Polycythemia'],meds:['Some hormone therapies can contribute.'],care:['Assess hydration and oxygenation; investigate persistent elevation.'],contra:'Do not assume dehydration without assessing the clinical picture.'}},
    {id:'mcv',name:'Mean Corpuscular Volume',abbr:'MCV',range:'80–100 fL',unit:'fL',why:'MCV describes average red blood cell size and helps classify anemia.',low:{label:'Too low — Microcytic pattern',info:'Low MCV means red cells are smaller than expected.',risks:['Usually reflects the underlying anemia rather than causing a separate risk.'],causes:['Iron deficiency','Thalassemia','Some chronic inflammatory states'],meds:['Some medications can contribute indirectly; evaluate the broader anemia workup.'],care:['Correlate with hemoglobin, iron studies, and clinical history.'],contra:'MCV alone does not establish the cause of anemia.'},high:{label:'Too high — Macrocytic pattern',info:'High MCV means red cells are larger than expected.',risks:['May accompany impaired DNA synthesis or other systemic disease.'],causes:['Vitamin B12/folate deficiency','Alcohol use','Liver disease','Some medications'],meds:['Some antimetabolites and other medications can increase MCV.'],care:['Assess nutrition, alcohol history, medication profile, and ordered B12/folate testing.'],contra:'Do not diagnose B12/folate deficiency from MCV alone.'}},
    {id:'mch',name:'Mean Corpuscular Hemoglobin',abbr:'MCH',range:'27–32 pg',unit:'pg',why:'MCH is the average amount of hemoglobin contained in each red blood cell.',low:{label:'Too low',info:'Low MCH often accompanies hypochromic, commonly iron-deficient red cells.',risks:['Usually reflects an underlying anemia pattern.'],causes:['Iron deficiency','Some hemoglobin disorders'],meds:['Not usually medication-specific.'],care:['Interpret with MCV, MCHC, hemoglobin, and iron studies.'],contra:'Do not interpret in isolation.'},high:{label:'Too high',info:'Higher MCH generally tracks with larger red-cell size and is interpreted with MCV.',risks:['Usually reflects an underlying macrocytic pattern.'],causes:['Macrocytosis','B12/folate deficiency','Other causes of large RBCs'],meds:['Some medications can contribute to macrocytosis.'],care:['Correlate with MCV and the anemia workup.'],contra:'MCH alone does not diagnose the cause.'}},
    {id:'mchc',name:'Mean Corpuscular Hemoglobin Concentration',abbr:'MCHC',range:'32–36 g/dL',unit:'g/dL',why:'MCHC reflects the average concentration of hemoglobin within red blood cells.',low:{label:'Too low',info:'Low MCHC indicates relatively low hemoglobin concentration in RBCs and is often associated with hypochromia.',risks:['Usually reflects the underlying anemia.'],causes:['Iron deficiency','Some chronic disorders'],meds:['Not usually medication-specific.'],care:['Interpret with MCV, MCH, hemoglobin, and iron studies.'],contra:'Do not use MCHC alone to determine anemia cause.'},high:{label:'Too high',info:'High MCHC is less common and can occur with certain red-cell disorders or analytical factors.',risks:['Depends on the underlying cause.'],causes:['Hereditary spherocytosis','Hemolysis or dehydration of RBCs','Laboratory artifact'],meds:['Not usually medication-specific.'],care:['Repeat/confirm unexpected results and correlate with smear and other indices.'],contra:'Unexpectedly high MCHC should be interpreted with the laboratory context.'}}

ng>Reference:</strong> ${esc(l.range)}</p></div><div class="diagnostic-detail"><div class="diagnostic-section"><h3>Function / Importance</h3><p>${esc(l.why)}</p></div>${side(l.low,l.id+'-low')}${side(l.high,l.id+'-high')}${medLinks?`<div class="diagnostic-section"><h3>Related Medications</h3><div class="link-chip-row">${medLinks}</div></div>`:''}<div class="diagnostic-section"><h3>Study Tools</h3><div class="action-row" style="margin-top:0"><button class="action-button" data-action="study">STUDY</button><button class="action-button" data-action="quiz">QUIZ ME</button><button class="action-button" data-action="nora">ASK NORA</button></div></div></div>`}

const nursingCalculatorDefinitions={
 dosage:{name:'Dose / quantity',fields:[['ordered','Ordered dose'],['available','Available dose'],['quantity','Available quantity (mL or tablets)']],formula:'Ordered dose ÷ available dose × available quantity. Dose units must match.'},
 weight:{name:'Weight-based dose',fields:[['weight','Weight (kg)'],['dose','Ordered dose (mg/kg/dose)']],formula:'Weight × prescribed mg/kg/dose. Enter a per-dose order, not a daily total.'},
 iv:{name:'IV pump rate',fields:[['volume','Volume (mL)'],['hours','Time (hours)']],formula:'Volume ÷ hours = mL/hr.'},
 drip:{name:'Gravity IV rate',fields:[['volume','Volume (mL)'],['minutes','Time (minutes)'],['factor','Tubing drop factor (gtt/mL)']],formula:'Volume × drop factor ÷ minutes = gtt/min. Check your tubing’s actual drop factor.'},
 maintenance:{name:'Pediatric maintenance fluids',fields:[['weight','Weight (kg)']],formula:'Daily Holliday–Segar: 100/50/20 mL/kg/day. Hourly 4–2–1: 4/2/1 mL/kg/hr. These are separate estimates.'}
};
function calculateNursing(type,values){
  const def=nursingCalculatorDefinitions[type];if(!def)throw new Error('Choose a calculator.');
  for(const [key] of def.fields)if(!Number.isFinite(values[key])||values[key]<=0)throw new Error('Enter a positive number in every field.');
  let value,unit;
  if(type==='dosage'){value=values.ordered/values.available*values.quantity;unit='mL or tablets (as entered)';}
  if(type==='weight'){value=values.weight*values.dose;unit='mg per dose';}
  if(type==='iv'){value=values.volume/values.hours;unit='mL/hr';}
  if(type==='drip'){value=Math.round(values.volume*values.factor/values.minutes);unit='gtt/min (rounded to a whole drop)';}
  if(type==='maintenance'){
    const w=values.weight;
    const daily=100*Math.min(w,10)+50*Math.min(Math.max(w-10,0),10)+20*Math.max(w-20,0);
    const hourly=4*Math.min(w,10)+2*Math.min(Math.max(w-10,0),10)+Math.max(w-20,0);
    if(!Number.isFinite(daily)||!Number.isFinite(hourly))throw new Error('The input value is too large to calculate.');
    return {text:daily.toLocaleString(undefined,{maximumFractionDigits:3})+' mL/day · '+hourly.toLocaleString(undefined,{maximumFractionDigits:3})+' mL/hr (4–2–1)',formula:def.formula};
  }
  if(!Number.isFinite(value))throw new Error('The input values are too large to calculate.');
  return {text:value.toLocaleString(undefined,{maximumFractionDigits:4})+' '+unit,formula:def.formula};
}
const conversionUnits={
 mass:{name:'Weight / mass',units:{kg:['kg',1000],g:['g',1],mg:['mg',.001],mcg:['mcg',.000001],lb:['lb',453.59237],oz:['oz',28.349523125]}},
 volume:{name:'Volume',units:{L:['L',1000],mL:['mL / cc',1],uL:['µL',.001],tsp:['US tsp',4.92892159375],tbsp:['US tbsp',14.78676478125],floz:['US fl oz',29.5735295625],cup:['US cup',236.5882365]}},
 length:{name:'Length',units:{m:['m',100],cm:['cm',1],mm:['mm',.1],in:['inches',2.54],ft:['feet',30.48]}},
 time:{name:'Time',units:{hr:['hours',3600],min:['minutes',60],sec:['seconds',1]}},
 temperature:{name:'Temperature',units:{C:['°C',1],F:['°F',1]}}
};
function calculateConversion(group,from,to,value){
  const units=conversionUnits[group]?.units;
  if(!units?.[from]||!units?.[to]||!Number.isFinite(value))throw new Error('Enter a number and valid units.');
  if(group!=='temperature'&&value<0)throw new Error('Enter a nonnegative value.');
  const result=group==='temperature'?(from===to?value:from==='C'?value*9/5+32:(value-32)*5/9):value*units[from][1]/units[to][1];
  if(!Number.isFinite(result))throw new Error('The input value is too large to convert.');
  return result;
}
function calculatorFields(type){

}
function conversionFields(group){

function daySchedule(now=new Date(),offset=1){
  const next=new Date(now);next.setDate(next.getDate()+offset);
  const key=next.getFullYear()+'-'+String(next.getMonth()+1).padStart(2,'0')+'-'+String(next.getDate()).padStart(2,'0');
  const events=calendarEvents.filter(e=>e[0]===key).map(e=>({title:e[2],time:e[1],detail:e[3]}));
  for(const e of clinicalEvents.filter(e=>e[0]===key))events.push({title:e[1]+' clinical',time:e[3],detail:e[2]});
  const unique=events.filter((e,i)=>events.findIndex(x=>x.title===e.title&&x.time===e.time&&x.detail===e.detail)===i);
  return {date:next,events:unique};
}

async function deleteResource(id){
  if(!currentAdmin){toastMsg('Admin session expired. Sign in again.');return}
  const r=(window.nurseHubResources||[]).find(x=>String(x.id)===String(id));
  if(!r){toastMsg('Resource not found.');return}
  const ok=window.confirm(`Delete "${r.title}"?\n\nThis removes the resource, extracted text, searchable sections, objective links, and stored file. This cannot be undone.`);
  if(!ok)return;

  toastMsg('Deleting resource…');
  try{
    // Remove dependent indexed records first so the resource cannot leave
    // behind stale chunks or objective mappings.
    const cleanupTables=[
      ['resource_chunk_objective_links','resource_id'],
      ['resource_objective_links','resource_id'],
      ['resource_chunks','resource_id'],
      ['resource_content','resource_id']
    ];
    for(const [table,column] of cleanupTables){
      const {error}=await supabaseClient.from(table).delete().eq(column,id);
      if(error)throw error;
    }

    const {error:resourceError}=await supabaseClient.from('resources').delete().eq('id',id);
    if(resourceError)throw resourceError;

    if(r.file_path){
      const {error:storageError}=await supabaseClient.storage.from('nurse-resources').remove([r.file_path]);
      if(storageError)console.warn('Resource database record was deleted, but old file cleanup failed:',storageError);
    }

    await loadPublicResourceKnowledge().catch(()=>{});
    await loadResources();
    toastMsg('Resource deleted.');
  }catch(err){
    toastMsg(err?.message||'Unable to delete resource.');
    await loadResources();
  }
}

async function replaceResourceFile(id){
  if(!currentAdmin){toastMsg('Admin session expired. Sign in again.');return}
  const input=document.getElementById('replaceResourceFile');
  const msg=document.getElementById('replaceResourceMessage');
  const file=input?.files?.[0];
  if(!file){if(msg){msg.className='admin-message error';msg.textContent='Choose a replacement file first.';}return}

  const {data:r,error:readError}=await supabaseClient.from('resources')
    .select('id,title,file_name,file_path,course,topic,content_type,status,description')
    .eq('id',id).maybeSingle();
  if(readError||!r){if(msg){msg.className='admin-message error';msg.textContent=readError?.message||'Resource not found.';}return}

  if(msg){msg.className='admin-message';msg.textContent='Reading and validating the replacement…';}

  let text='',analysis,rows;
  try{
    text=await extractResourceText(file);
    if(!text.trim())throw new Error('No readable text was found in the replacement file.');
    analysis=analyzeResource(text);
    rows=resourceChunkRows(id,analysis);
  }catch(err){
    if(msg){msg.className='admin-message error';msg.textContent=err.message||'Could not read this file.';}
    return;
  }

  // Upload the replacement under a new path first. The old source remains
  // untouched until the new file and its indexed content are safely stored.
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const newPath=`${currentAdmin.id}/${Date.now()}_replacement_${safeName}`;
  const {error:uploadError}=await supabaseClient.storage.from('nurse-resources').upload(newPath,file,{upsert:false});
  if(uploadError){if(msg){msg.className='admin-message error';msg.textContent=uploadError.message;}return}

  let insertedContent=false, insertedChunks=false;
  try{
    // Capture existing objective connections before changing indexed content.
    const {data:oldLinks,error:oldLinksError}=await supabaseClient.from('resource_objective_links')
      .select('resource_id,objective_key,course,topic,objective_number')
      .eq('resource_id',id);
    if(oldLinksError)throw oldLinksError;

    const {error:contentError}=await supabaseClient.from('resource_content').upsert({
      resource_id:id,
      extracted_text:text,
      processing_status:'ready',
      processed_at:new Date().toISOString()
    },{onConflict:'resource_id'});
    if(contentError)throw contentError;
    insertedContent=true;

    const {error:deleteChunksError}=await supabaseClient.from('resource_chunks').delete().eq('resource_id',id);
    if(deleteChunksError)throw deleteChunksError;

    if(rows.length){
      const {error:chunkError}=await supabaseClient.from('resource_chunks').insert(rows);
      if(chunkError)throw chunkError;
      insertedChunks=true;
    }

    // Rebuild chunk→objective mappings using the new analysis while preserving
    // the existing resource-level objective links.
    await supabaseClient.from('resource_chunk_objective_links').delete().eq('resource_id',id);
    const oldKeys=new Set((oldLinks||[]).map(x=>String(x.objective_key)));
    const rebuilt=[];
    for(const suggestion of (analysis.suggestions||[])){
      if(!oldKeys.has(String(suggestion.key)))continue;
      const indices=(suggestion.chunks||[suggestion.chunk]).filter(Number.isInteger);
      const old=oldLinks.find(x=>String(x.objective_key)===String(suggestion.key));
      for(const chunkIndex of indices)rebuilt.push({
        resource_id:id,
        chunk_index:chunkIndex,
        objective_key:suggestion.key,
        course:old?.course||'NUR 2129',
        topic:old?.topic||suggestion.topic,
        objective_number:String(old?.objective_number||suggestion.objective)
      });
    }
    if(rebuilt.length){
      const {error:mapError}=await supabaseClient.from('resource_chunk_objective_links')
        .upsert(rebuilt,{onConflict:'resource_id,chunk_index,objective_key'});
      if(mapError&&!/relation .* does not exist/i.test(mapError.message||''))throw mapError;
    }

    const {error:updateError}=await supabaseClient.from('resources').update({
      file_name:file.name,
      file_path:newPath,
      updated_at:new Date().toISOString()
    }).eq('id',id);
    if(updateError)throw updateError;

    // Only after the database now points to the replacement do we remove the
    // previous storage object.
    if(r.file_path){
      const {error:oldFileError}=await supabaseClient.storage.from('nurse-resources').remove([r.file_path]);
      if(oldFileError)console.warn('Replacement succeeded, but old file cleanup failed:',oldFileError);
    }

    await loadPublicResourceKnowledge().catch(()=>{});
    nav=[{type:'settings'},{type:'resource-hopper'}];
    setPage(renderResourceHopper());
    await loadResources();
    toastMsg('Resource replaced successfully.');
  }catch(err){
    // The old file/resource metadata remains in place if the swap failed before
    // the final resource update. Remove only the newly uploaded object.
    await supabaseClient.storage.from('nurse-resources').remove([newPath]).catch(()=>{});
    if(msg){msg.className='admin-message error';msg.textContent='Replacement failed: '+(err.message||'Unknown error');}
    console.error('Resource replacement failed',err);
  }
}

function objectiveKey(section,objective){return `NUR 2129|${section.title}|${objective.number}`;}
async function getResourcesForObjective(section,objective){
const key=objectiveKey(section,objective);
let rs=(window.nurseHubResources||[]).filter(r=>String(r.status||'').toLowerCase()==='published');
let links=(window.nurseHubObjectiveLinks||[]).filter(x=>x.objective_key===key);
if(!rs.length||!links.length){
  const [res,linkRes]=await Promise.all([
    supabaseClient.from('resources').select('id,title,file_name,file_path,course,topic,content_type,status,description,created_at').eq('status','published').order('created_at',{ascending:false}),
    supabaseClient.from('resource_objective_links').select('resource_id,objective_key,course,topic,objective_number').eq('objective_key',key)
  ]);
  if(!res.error)rs=res.data||[];
  if(!linkRes.error)links=linkRes.data||[];
}
if(links.length){
  const ids=new Set(links.map(x=>String(x.resource_id)));
  return rs.filter(r=>ids.has(String(r.id)));
}
const norm=x=>String(x||'').trim().toLowerCase();
return rs.filter(r=>(!r.course||norm(r.course)==='nur 2129')&&r.topic&&norm(r.topic)===norm(section.title));
}
function getChunksForObjective(section,objective,resourceId){
  const chunks=(window.nurseHubChunks||[]).filter(c=>String(c.resource_id)===String(resourceId));
  if(!chunks.length)return [];
  const key=objectiveKey(section,objective);
  const exactLinks=(window.nurseHubChunkObjectiveLinks||[]).filter(x=>String(x.resource_id)===String(resourceId)&&String(x.objective_key)===String(key));
  const byIndex=new Map(chunks.map(c=>[String(c.chunk_index),c]));
  if(exactLinks.length){
    const exact=exactLinks.map(x=>byIndex.get(String(x.chunk_index))).filter(Boolean);
    if(exact.length)return exact.sort((a,b)=>Number(a.chunk_index)-Number(b.chunk_index));
  }

  // Structured NORA-ready sources carry OBJECTIVE in every chunk heading.
  // Use that explicit structure first so an objective gets its full source coverage,
  // rather than the old top-score/first-8 behavior that could hide most of the material.
  const objectiveNumber=String(objective.number).replace(/\.$/,'');
  const structured=chunks.filter(c=>{
    const h=String(c.heading||'');
    return new RegExp(`\\bOBJECTIVE\\s+${objectiveNumber}\\b`,'i').test(h) ||
      new RegExp(`\\bObjective\\s+${objectiveNumber}\\b`,'i').test(h);
  });
  if(structured.length)return structured.sort((a,b)=>Number(a.chunk_index)-Number(b.chunk_index));

  // Legacy/unstructured resources still use relevance scoring as a fallback.
  const objectiveTerms=cleanWords([section.title,objective.text,...objective.subitems,objective.courseObjectives].join(' '));
  const exactTerms=[...new Set(objectiveTerms)].filter(w=>w.length>3);
  const scored=chunks.map(c=>{
    const hay=String((c.heading||'')+' '+(c.content||'')).toLowerCase();
    const base=scoreMatch((c.heading||'')+' '+(c.content||''),objective,section.title);
    const exactHits=exactTerms.filter(w=>hay.includes(w)).length;
    const headingBoost=cleanWords(c.heading||'').filter(w=>exactTerms.includes(w)).length*2;
    const topicHits=cleanWords(section.title).filter(w=>hay.includes(w)).length;
    return {chunk:c,score:base.score+exactHits+headingBoost+topicHits};
  });
  const strong=scored.filter(x=>x.score>=3).sort((a,b)=>b.score-a.score);
  if(strong.length)return strong.slice(0,20).map(x=>x.chunk).sort((a,b)=>Number(a.chunk_index)-Number(b.chunk_index));
  return scored.filter(x=>x.score>=1).sort((a,b)=>b.score-a.score).slice(0,8).map(x=>x.chunk).sort((a,b)=>Number(a.chunk_index)-Number(b.chunk_index));
}
function normalizeNoteTopic(value){
  return String(value||'').toLowerCase().replace(/^(?:[a-z][.)]|\d+(?:\.\d+)*[.)]?)\s+/,'')
    .replace(/[^a-z0-9]+/g,' ')
    .replace(/\bchlamydial\b/g,'chlamydia')
    .replace(/\bnon\s+(hormonal|operative)\b/g,'non$1')
    .replace(/\b(options?|methods?|permanent)\b/g,' ')
    .replace(/\s+/g,' ').trim();
}
function noteTopicMatches(label,topic){
  const a=normalizeNoteTopic(label),b=normalizeNoteTopic(topic);
  if(a===b||(' '+a+' ').includes(' '+b+' ')||(' '+b+' ').includes(' '+a+' '))return true;
  const aliases=[['herpes genitals','genital herpes'],['condyloma acuminate','condyloma acuminata'],['urinary tract infection','uti'],['perinatal infections torch','torch overview'],['tindazole','tinidazole']];
  return aliases.some(pair=>pair.some(x=>a.includes(x))&&pair.some(x=>b.includes(x)));
}
function inlineTopicCard(title,entries){
  const body=entries.length?entries.map(({chunk,resource,section})=>`<article class="objective-note"><small class="inline-note-source">${esc(resource.title)}</small><div class="objective-note-kicker">${esc(section)}</div><div class="objective-note-text">${renderObjectiveNoteText(chunk.content)}</div></article>`).join(''):'<div class="admin-message">No linked notes yet for this topic.</div>';
  return `<details class="objective-topic-group"><summary class="objective-topic-toggle"><span><span class="objective-topic-title">${esc(title)}</span><span class="objective-topic-hint"><span class="topic-hint-closed">Click to view notes</span><span class="topic-hint-open">Click to hide notes</span></span></span><span class="objective-topic-chevron" aria-hidden="true">⌄</span></summary><div class="objective-topic-sections">${body}</div></details>`;
}
async function renderInlineObjectiveNotes(section,objective){
  const list=document.querySelector('.objective-subitems');
  await loadPublicResourceKnowledge();
  const resources=await getResourcesForObjective(section,objective);
  const groups=new Map();
  for(const resource of resources){
    for(const chunk of getChunksForObjective(section,objective,resource.id)){
      const match=String(chunk.heading||'').match(/^OBJECTIVE\s+\d+\s*[·|]\s*(\d+\.\d+\s+.+?)\s*[·|]\s*(.+)$/i);
      if(!match)continue;
      const topic=match[1].replace(/^\d+\.\d+\s+/,'').trim();
      if(!groups.has(topic))groups.set(topic,[]);
      groups.get(topic).push({chunk,resource,section:match[2]});
    }
  }
  if(!list?.isConnected)return '';
  if(!groups.size)return renderObjectiveResources(section,objective);
  const used=new Set();
  list.innerHTML=(objective.subitems||[]).map(label=>{
    const entries=[];
    groups.forEach((items,topic)=>{if(noteTopicMatches(label,topic)){used.add(topic);entries.push(...items);}});
    return `<li class="interactive-topic">${inlineTopicCard(label,entries)}</li>`;
  }).join('');
  const extras=[...groups.entries()].filter(([topic])=>!used.has(topic));
  return `${extras.length?`<div class="settings-card"><h3>Additional linked topics</h3><div class="objective-notes">${extras.map(([topic,items])=>inlineTopicCard(topic,items)).join('')}</div></div>`:''}<div class="meta-box inline-source-link"><span class="meta-label">Source files</span>${resources.map(resource=>`<div class="objective-resource-card"><span><strong>${esc(resource.title)}</strong><small>Original instructor material</small></span><button class="admin-secondary resource-mini" data-resource-open="${esc(resource.id)}">OPEN SOURCE</button></div>`).join('')}</div>`;
}

async function showObjectiveResourceNotes(section,objective,resourceId){

async function extractResourceText(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.txt')||name.endsWith('.md')||name.endsWith('.csv')) return await file.text();
  if(name.endsWith('.docx')){
    const mammoth=await import('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/+esm');
    const buf=await file.arrayBuffer();
    const out=await mammoth.extractRawText({arrayBuffer:buf});
    return out.value||'';
  }
  if(name.endsWith('.pdf')){
    const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/+esm');
    pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.worker.mjs';
    const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;
    const pages=[];
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i); const tc=await page.getTextContent();
      pages.push(tc.items.map(x=>x.str||'').join(' '));
    }
    return pages.join('\n\n');
  }
  throw new Error('This first Hopper processor supports DOCX, PDF, TXT, MD, and CSV files.');
}
function cleanWords(text){return String(text||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!['the','and','for','with','from','that','this','are','was','were','into','their','they','have','has','will','can','may','not','than','then','when','what','which','your','you','patient','patients','nursing','nurse'].includes(w));}
function splitResourceText(text){
  const raw=String(text||'').replace(/\r\n?/g,'\n').trim();

  // NORA-ready structured sources: split at SECTION boundaries while preserving
  // COURSE / CLASS / OBJECTIVE / TOPIC context in the chunk heading.
  const structured=/^OBJECTIVE\s+\d+\s*[—-]/mi.test(raw)&&/^[-]{3,}\s+\d+\.\d+\s+.+?\s+[-]{3,}$/mi.test(raw);
  if(structured){
    const lines=raw.split('\n');
    const chunks=[]; let objective=null,topic=null,section=null,body=[];
    const flush=(forceTopic=false)=>{
      const content=body.join('\n').trim();
      if(content&&objective&&topic&&(section||forceTopic)){
        chunks.push({content,heading:`OBJECTIVE ${objective} · ${topic} · ${section||'TOPIC OVERVIEW'}`});
      }
      body=[];
    };
    lines.forEach(line=>{
      const t=line.trim();
      const om=t.match(/^OBJECTIVE\s+(\d+)\s*[—-]/i);
      if(om){flush(true);objective=om[1];topic=null;section=null;return;}
      const tm=t.match(/^-{3,}\s+(\d+\.\d+)\s+(.+?)\s+-{3,}$/);
      if(tm){flush(true);topic=`${tm[1]} ${tm[2].trim()}`;section=null;return;}
      const sm=t.match(/^(ORGANISM\s*\/\s*ETIOLOGY|CLINICAL MANIFESTATIONS|DIAGNOSIS(?:\s*\/\s*SCREENING)?|MEDICAL MANAGEMENT|MATERNAL-FETAL\s*\/\s*NEONATAL RISKS|NURSING CARE\s*\/\s*PATIENT EDUCATION|INSTRUCTOR-SOURCE NOTES):?$/i);
      if(sm&&topic){flush();section=sm[1].toUpperCase().replace(/\s*\/\s*/g,' / ');return;}
      if(topic)body.push(line);
    });
    flush(true);
    if(chunks.length)return chunks;
  }

  // Fallback for ordinary PDF/DOCX/TXT uploads that do not use the NORA-ready structure.
  const paras=raw.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  const chunks=[]; let cur=[];
  paras.forEach(p=>{cur.push(p); if(cur.length>=4){chunks.push({content:cur.join('\n\n'),heading:(cur[0]||'').slice(0,160)});cur=[];}});
  if(cur.length)chunks.push({content:cur.join('\n\n'),heading:(cur[0]||'').slice(0,160)});
  if(!chunks.length&&raw)chunks.push({content:raw,heading:raw.slice(0,160)});
  return chunks.slice(0,500);
}
function scoreMatch(text, objective, topicTitle){
  const words=new Set(cleanWords(typeof text==='object'&&text?.content?text.content:text));
  const target=cleanWords([topicTitle,objective.text,...objective.subitems,objective.courseObjectives].join(' '));
  const uniq=[...new Set(target)]; let score=0;
  uniq.forEach(w=>{if(words.has(w))score++;});
  const titleWords=cleanWords(topicTitle); const titleHits=titleWords.filter(w=>words.has(w)).length;
  return {score:score+titleHits*2,titleHits,ratio:uniq.length?score/Math.min(uniq.length,30):0};
}
function analyzeResource(text){
  const chunks=splitResourceText(text); const suggestions=[];
  objectiveData.forEach((topic,si)=>topic.objectives.forEach((o,oi)=>{
    const objectiveNumber=String(o.number).replace(/\.$/,'');
    const structuredChunks=chunks.map((c,i)=>({c,i})).filter(x=>new RegExp(`\\bOBJECTIVE\\s+${objectiveNumber}\\b`,'i').test(String(x.c.heading||'')));
    const pool=structuredChunks.length?structuredChunks:chunks.map((c,i)=>({c,i}));
    let best={score:0,chunk:pool[0]?.i||0};
    pool.forEach(x=>{const sc=scoreMatch(x.c.content,o,topic.title);if(sc.score>best.score)best={...sc,chunk:x.i};});
    const overall=scoreMatch(text,o,topic.title);
    if(structuredChunks.length || best.score>=2 || overall.score>=3){
      suggestions.push({
        si,oi,key:objectiveKey(topic,o),topic:topic.title,objective:o.number,text:o.text,
        score:Math.max(best.score,overall.score),chunk:best.chunk,
        chunks:structuredChunks.length?structuredChunks.map(x=>x.i):[best.chunk]
      });
    }
  }));
  suggestions.sort((a,b)=>b.score-a.score);
  const topicScores=objectiveData.map((t,si)=>{const sc=scoreMatch(text,{text:'',subitems:[],courseObjectives:''},t.title);return {si,title:t.title,score:sc.titleHits};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8);
  return {chunks,suggestions:suggestions.slice(0,40),topics:topicScores};
}
function resourceChunkRows(resourceId,analysis){
  return analysis.chunks.map((chunk,i)=>{
    const content=typeof chunk==='string'?chunk:chunk?.content;
    if(typeof content!=='string'||!content.trim())throw new Error('Extracted section '+(i+1)+' has no readable text.');
    const heading=typeof chunk==='object'&&typeof chunk.heading==='string'?chunk.heading:(content.split('\n')[0]||'');
    return {resource_id:resourceId,chunk_index:i,heading:heading.slice(0,160),content};
  });
}

// NORA Consolidation 1 — deterministic Nurse Hub intelligence layer.
// No external LLM/API is used here. NORA classifies requests, retrieves indexed app knowledge,
// prioritizes instructor-linked material, preserves source boundaries, and performs navigation.
const NORA_INTENTS={
  EXPLAIN:/\b(explain|teach|tell me about|help me understand|how does|what does)\b/i,
  DEFINE:/\b(define|definition|what is|what are|meaning of)\b/i,
  COMPARE:/\b(compare|difference between|different from|versus|vs\.?|contrast)\b/i,
  SUMMARIZE:/\b(summarize|summary|sum up|condense|in short)\b/i,
  STUDY:/\b(study|review|help me learn|study guide|review guide)\b/i,
  QUIZ:/\b(quiz|test me|practice questions|practice quiz)\b/i,
  OPEN_OBJECTIVE:/\b(open|show|go to|take me to)\b.*\b(objective|obj\.?\s*\d+)/i,
  OPEN_TOPIC:/\b(open|show|go to|take me to)\b.*\b(class|course|topic|unit|module)\b/i,
  OPEN_RESOURCE:/\b(open|show|go to|find)\b.*\b(resource|notes|note|study material|file|document|powerpoint|ppt|pdf)\b/i,
  OPEN_MEDICATION:/\b(open|show|go to)\b.*\b(medication|med|drug)\b/i,
  OPEN_DIAGNOSTIC:/\b(open|show|go to)\b.*\b(lab|diagnostic|test|vital|vitals)\b/i,
  OPEN_CALENDAR:/\b(open|show|go to|what('s| is))\b.*\b(calendar|schedule|clinical|class schedule)\b/i
};

function noraTokens(q){
  const stop=new Set(['the','and','for','with','from','that','this','what','which','where','when','does','about','into','your','you','can','could','would','should','please','tell','show','find','open','take','me','give','make','help','how','why','is','are','was','were','have','has','had','my','our','their','them','this','that','there','here','just','really','like','need','want','know','learn']);
  return [...new Set(String(q||'').toLowerCase().replace(/[^a-z0-9\s-]/g,' ').split(/\s+/).filter(w=>w.length>2&&!stop.has(w)))];
}
function noraNorm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9\s-]/g,' ').replace(/\s+/g,' ').trim()}
function noraScoreText(text,tokens){
  const hay=noraNorm(text); let score=0;
  tokens.forEach(t=>{if(hay.includes(t))score+=hay===t?4:1});
  return score;
}
function noraClassify(q){
  const lower=String(q||'').trim();
  if(!lower)return {intent:'HELP',mode:'NURSE_HUB',confidence:1};
  if(/^((hi|hey|hello|yo|sup|good morning|good afternoon|good evening)\b)/i.test(lower))return {intent:'GREETING',mode:'NURSE_HUB',confidence:1};
  if(/what can you do|how can you help|what do you know/i.test(lower))return {intent:'HELP',mode:'NURSE_HUB',confidence:1};
  if(/strictly|only.*notes|notes only|from my notes|from the uploaded material/i.test(lower))return {intent:NORA_INTENTS.QUIZ.test(lower)?'QUIZ':(NORA_INTENTS.STUDY.test(lower)?'STUDY':'EXPLAIN'),mode:'NOTES_ONLY',confidence:.95};
  for(const [intent,re] of Object.entries(NORA_INTENTS)){if(re.test(lower))return {intent,mode:'NURSE_HUB',confidence:.86};}
  return {intent:'SEARCH',mode:'NURSE_HUB',confidence:.55};
}

async function loadNoraKnowledge(force=false){
  if(window.noraKnowledge && !force)return window.noraKnowledge;
  const out={resources:[],chunks:[],objectiveLinks:[],chunkLinks:[],loadedAt:Date.now()};
  try{
    const [r,c,o,co]=await Promise.all([
      supabaseClient.from('resources').select('id,title,file_name,course,topic,description,status,source_type,updated_at').eq('status','published').order('updated_at',{ascending:false}),
      supabaseClient.from('resource_chunks').select('resource_id,chunk_index,heading,content').limit(5000),
      supabaseClient.from('resource_objective_links').select('resource_id,objective_key,course,topic,objective_number').limit(5000),
      supabaseClient.from('resource_chunk_objective_links').select('resource_id,chunk_index,objective_key,course,topic,objective_number').limit(5000)
    ]);
    if(!r.error)out.resources=r.data||[];
    if(!c.error)out.chunks=c.data||[];
    if(!o.error)out.objectiveLinks=o.data||[];
    if(!co.error)out.chunkLinks=co.data||[];

  window.noraKnowledge=out;
  return out;
}
function noraObjectiveKeyFromData(section,o){return typeof objectiveKey==='function'?objectiveKey(section,o):`${section.title}::${o.number}`}
function noraFindObjectiveRefs(q){
  const lower=String(q||'').toLowerCase(); const refs=[];
  objectiveData.forEach((s,si)=>s.objectives.forEach((o,oi)=>{
    const key=noraObjectiveKeyFromData(s,o); const exact=new RegExp(`\\bobjective\\s*${String(o.number).replace('.','\\.')}\\b`,'i').test(lower);
    const topicHit=noraNorm(s.title).split(' ').some(w=>w.length>3&&lower.includes(w));
    const textScore=noraTermScore([s.title,o.text,...o.subitems].join(' '),noraTokens(q));
    if(exact||topicHit||textScore>=2)refs.push({si,oi,section:s,objective:o,key,score:(exact?12:0)+(topicHit?5:0)+textScore});
  }));
  return refs.sort((a,b)=>b.score-a.score).slice(0,5);
}
function noraBuildResourceMatches(q,mode='NURSE_HUB'){
  const k=window.noraKnowledge||{resources:[],chunks:[],objectiveLinks:[],chunkLinks:[]};
  const byId=new Map(k.resources.map(r=>[String(r.id),r])); const tokens=noraTokens(q); const refs=noraFindObjectiveRefs(q);
  const linkedKeys=new Set(refs.map(r=>r.key)); const linkedResourceIds=new Set();
  k.objectiveLinks.forEach(l=>{if(linkedKeys.has(l.objective_key))linkedResourceIds.add(String(l.resource_id))});
  const matches=[];

function noraTermVariants(token){
  const t=noraNorm(token);
  const variants=new Set([t]);
  if(t.length>=7)variants.add(t.slice(0,7));
  if(t.endsWith('s')&&t.length>4)variants.add(t.slice(0,-1));
  if(t.endsWith('ies')&&t.length>5)variants.add(t.slice(0,-3)+'y');
  if(t.endsWith('ing')&&t.length>6)variants.add(t.slice(0,-3));
  if(t.endsWith('ed')&&t.length>5)variants.add(t.slice(0,-2));
  return [...variants];
}
function noraTermScore(text,tokens){
  const hay=noraNorm(text);let score=0;
  tokens.forEach(t=>{
    const vars=noraTermVariants(t);
    if(vars.some(v=>v.length>=5&&hay.includes(v)))score+=2;
    if(hay.includes(t))score+=2;
  });
  return score;
}
function noraRelevantSentences(text,q,maxCount=3,maxChars=520){
  const raw=String(text||'').replace(/\r/g,'\n');
  const parts=raw.split(/(?<=[.!?])\s+|\n+/)
    .map(x=>x.replace(/^[•●▪◦–—-]+\s*/,'').replace(/\s+/g,' ').trim())
    .filter(x=>x.length>=8);
  if(!parts.length)return '';
  const tokens=noraTokens(q);
  const scored=parts.map((sentence,index)=>({
    sentence,index,
    score:noraTermScore(sentence,tokens)
  })).filter(x=>x.score>0);
  if(!scored.length)return '';

  scored.sort((a,b)=>b.score-a.score||a.index-b.index);
  const anchor=scored[0];
  const selected=[anchor];
  // Add nearby context only when it is genuinely relevant or is immediately adjacent
  // to the strongest hit. This keeps a definition from pulling in unrelated material.
  for(const candidate of scored.slice(1)){
    if(selected.length>=maxCount)break;
    const distance=Math.abs(candidate.index-anchor.index);
    if(distance<=2)selected.push(candidate);
  }
  selected.sort((a,b)=>a.index-b.index);

  const picked=[];let chars=0;
  for(const item of selected){
    const clean=item.sentence;
    if(picked.some(x=>noraNorm(x)===noraNorm(clean)))continue;
    if(chars+clean.length>maxChars && picked.length)continue;
    picked.push(clean);chars+=clean.length+1;
  }

}

function reviewedRecallBank(entries){
 const bank=[
  {topic:'Bacterial Vaginosis',pattern:/clue cell[^\n]*/i,prompt:'The selected notes describe bacterial vaginosis. Which microscopy finding supports this topic?',answer:'Clue cells',other:['Mobile trichomonads','Vesicular lesions','A serologic titer']},
  {topic:'Bacterial Vaginosis',pattern:/whiff[^\n]*/i,required:/fishy/i,prompt:'According to the selected bacterial vaginosis notes, what does a positive whiff test reveal?',answer:'A fishy odor',other:['A vesicular rash','Urinary retention','An enlarged lymph node']},
  {topic:'Candidiasis',pattern:/cottage[^\n]*/i,prompt:'Which discharge description appears in the selected candidiasis notes?',answer:'Cottage cheese–like discharge',other:['A fishy whiff-test odor','Vesicular blisters','No specific description is documented']},
  {topic:'Trichomoniasis',pattern:/both partners[^\n]*/i,required:/treat/i,prompt:'A student reviews the uploaded trichomoniasis teaching notes. Who must be treated?',answer:'Both partners',other:['Only the symptomatic partner','Only the partner attending the visit','Neither partner requires treatment']},
  {topic:'Trichomoniasis',pattern:/mobile trichomonads[^\n]*/i,prompt:'Which microscopy finding appears in the selected trichomoniasis notes?',answer:'Mobile trichomonads',other:['Clue cells','A positive RPR titer','Vesicular lesions']},
  {topic:'Syphilis',pattern:/[^\n]*RPR[^\n]*/i,required:/VDRL/i,prompt:'Which pair of tests is listed in the selected syphilis notes?',answer:'RPR and VDRL',other:['A whiff test and clue-cell examination','A pregnancy test and urine culture','A glucose tolerance test and A1c']},
  {topic:'Chlamydia',pattern:/[^\n]*NAAT[^\n]*/i,prompt:'Which testing method appears in the selected chlamydia notes?',answer:'Nucleic acid amplification testing (NAAT)',other:['A whiff test alone','A glucose tolerance test','An electrocardiogram']},
  {topic:'Genital herpes',pattern:/[^\n]*(?:vesicle|blister)[^\n]*/i,prompt:'Which lesion description appears in the selected genital herpes notes?',answer:'Vesicles or blisters',other:['Clue cells','Mobile trichomonads','A cottage cheese–like discharge']}
 ];
 return bank.flatMap(b=>{const candidates=entries.filter(e=>noteTopicMatches(b.topic,e.topic));const e=candidates.find(e=>b.pattern.test(e.chunk.content)&&(!b.required||b.required.test(e.chunk.content.match(b.pattern)?.[0]||'')));if(!e)return [];const quote=e.chunk.content.match(b.pattern)[0].trim(),options=quizShuffle([b.answer,...b.other]);return [{prompt:b.prompt,quote:'',options,correct:options.indexOf(b.answer),rationale:'The selected source states: “'+quote+'”. This supports '+b.answer+'. The other choices do not answer the question asked about this cited passage.',sourceTitle:e.resource.title,resourceId:String(e.resource.id),heading:e.chunk.heading||e.section}];});
}

function buildRecallQuestions(entries,count){
 const topics=[...new Set(entries.map(e=>e.topic))],questions=quizShuffle(reviewedRecallBank(entries)).slice(0,count),seen=new Set();
 if(questions.length>=count)return questions;
 // Ask which source section contains a quoted passage, never infer diagnosis or care.
 for(const e of quizShuffle(entries)){
  const lines=e.chunk.content.split(/\n/).map(x=>x.replace(/^\s*[-•]\s*/,'').trim()).filter(x=>x.length>=35&&x.length<=350&&!/source gap|not (?:specified|provided|covered)|objective\s+\d|section\s*:|^[-=]{3}/i.test(x));
  for(const quote of quizShuffle(lines)){
   const normalized=quote.toLowerCase();if(seen.has(normalized)||topics.length<2)continue;
   const candidates=topics.filter(t=>t!==e.topic&&!entries.some(x=>x.topic===t&&x.chunk.content.toLowerCase().includes(normalized)));
   if(!candidates.length)continue;
   const options=quizShuffle([e.topic,...quizShuffle(candidates).slice(0,3)]);seen.add(normalized);
   questions.push({prompt:'Which topic’s selected notes contain this exact passage?',quote,options,correct:options.indexOf(e.topic),rationale:'The cited '+e.topic+' section contains this passage. This question checks recall of the selected notes; it does not establish that the finding is exclusive to this condition.',sourceTitle:e.resource.title,resourceId:String(e.resource.id),heading:e.chunk.heading||e.section});break;
  }
  if(questions.length>=count)break;
 }
 return questions;
}

function noraNotesAnswer(q){
 let entries=studyEntries();if(!entries.length)return '';
 const normalized=normalizeNoteTopic(q),tokens=normalized.split(' ').filter(t=>t.length>3),topics=[...new Set(entries.map(e=>e.topic))];
 const matches=topics.filter(t=>{const n=normalizeNoteTopic(t);return n&&(' '+normalized+' ').includes(' '+n+' ');}).sort((a,b)=>b.length-a.length);
 let topic=matches[0];
 if(!topic){const scored=topics.map(t=>({t,score:tokens.filter(x=>normalizeNoteTopic(t).split(' ').includes(x)).length})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);if(scored.length&&(!scored[1]||scored[0].score>scored[1].score))topic=scored[0].t;}
 if(!topic&&window.noraLastTopic&&(/\b(this|that|it)\b/i.test(q)||!normalized.split(' ').some(t=>!['what','are','is','the','a','an','and','of','for','how','does','do','its','about','please','tell','me','treatment','treat','symptoms','signs','diagnosis','diagnosed','complications','risks','prevention','medications','drugs','teaching'].includes(t))))topic=window.noraLastTopic;
 if(!topic)return '';window.noraLastTopic=topic;entries=entries.filter(e=>e.topic===topic);

 return `<p>Here’s what the published notes say about <strong>${esc(topic)}</strong>:</p>${entries.slice(0,8).map(e=>`<div class="nora-study-card"><strong>${esc(e.section)}</strong><div class="objective-note-text">${renderObjectiveNoteText(e.chunk.content)}</div><small>${esc(e.resource.title)} · ${esc(e.chunk.heading)}</small><p><button class="nora-action" data-resource-open="${esc(e.resource.id)}">OPEN SOURCE</button></p></div>`).join('')}${entries.length>8?'<p>Showing eight relevant sections. Open the source for the complete notes.</p>':''}<p class="nora-context-note">Extracted from uploaded notes. Source gaps remain gaps.</p><div class="nora-action-row"><button class="nora-action" data-nora-prompt="What are the symptoms of ${esc(topic)}?">SYMPTOMS</button><button class="nora-action" data-nora-prompt="What is the treatment for ${esc(topic)}?">TREATMENT</button><button class="nora-action" data-nora-prompt="How is ${esc(topic)} diagnosed?">DIAGNOSIS</button></div>`;

function noraBuildAnswer(q,retrieval,classification){
  const {intent,mode}=classification, matches=retrieval.matches;
  if(intent==='GREETING')return `<p>${esc(noraWelcome())}</p>${noraQuickActions()}`;
  if(intent==='HELP')return `<p>I’m the free, in-app Nurse Hub assistant. I can do more than keyword search:</p><ul class="nora-list"><li>Connect questions to objectives and their linked resources</li><li>Prioritize instructor-uploaded material when it exists</li><li>Search diagnostics, medications, vitals, and course objectives</li><li>Follow up using the context of our current conversation</li><li>Navigate you directly to objectives, resources, medications, diagnostics, or Calendar</li><li>Build a source-based study view from the information Nurse Hub actually has</li></ul><p class="nora-context-note">I do not browse the outside web or generate general medical knowledge. For that kind of advanced reasoning, use ChatGPT separately.</p>${noraQuickActions()}`;
  const navTarget=noraNavigationTarget(q,retrieval);
  if(navTarget)return `<p>I found the relevant Nurse Hub destination. Tap below to open it.</p><div class="nora-action-grid"><button type="button" class="nora-action" data-nora-nav='${esc(JSON.stringify(navTarget))}'>OPEN IN NURSE HUB</button></div>`;
  if(intent==='QUIZ')return `<p>I found the material for this topic. I’ll hand the topic to Nurse Hub’s current Quiz Me tool rather than pretending I can generate NCLEX-level reasoning without an AI model.</p><div class="nora-action-grid"><button type="button" class="nora-action" data-nora-open-quiz="${esc(q)}">OPEN QUIZ ME</button></div>${noraGapHtml(retrieval)}`;
  const notesAnswer=noraNotesAnswer(q);if(notesAnswer&&intent!=='COMPARE')return notesAnswer;
  if(!matches.length)return `<p>I couldn’t find enough matching information inside Nurse Hub.</p><p>Try a specific objective, medication, lab, diagnostic, course topic, or term from an uploaded resource.</p><p class="nora-context-note">I won’t fill the gap with outside medical information because this version of NORA is intentionally source-bounded.</p>`;
  const top=matches[0];
  let body=`<div class="nora-intent-row"><span class="nora-intent-pill active">${esc(noraIntentLabel(intent))}</span><span class="nora-intent-pill">${esc(mode)}</span></div>`;
  if(intent==='COMPARE'){
    const items=matches.slice(0,4);body+=`<p>I found ${items.length} relevant Nurse Hub entries. I can compare only what the stored material actually covers.</p>`;
    body+=items.map((m)=>`<div class="nora-compare-item"><strong>${esc(m.title)}</strong><div>${noraExplainMatch(m,q)}</div></div>`).join('');
  }else if(intent==='SUMMARIZE'||intent==='STUDY'){
    body+=`<p>Here’s a focused source-based view using the strongest passages I found:</p>`;
    body+=matches.slice(0,4).map(m=>`<div class="nora-study-snippet">${noraExplainMatch(m,q)}</div>`).join('');
  }else body+=`<p>${noraExplainMatch(top,q)}</p>`;
  const groups={};matches.slice(0,5).forEach((m,i)=>{const key=m.type==='resource'?(m.linked?'Instructor resources':'Uploaded resources'):'Nurse Hub reference';(groups[key]??=[]).push([m,i])});
  Object.entries(groups).forEach(([title,items])=>{body+=`<div class="nora-source-group"><div class="nora-source-group-title">${esc(title)}</div>${items.map(([m,i])=>noraSourceCard(m,i)).join('')}</div>`});
  if(classification.mode!=='NOTES_ONLY' && /\bobjective\b/i.test(q))body+=noraRelatedObjectivesHtml(retrieval);
  body+=`<div class="nora-action-row"><button type="button" class="nora-action" data-nora-prompt="Study this">STUDY</button><button type="button" class="nora-action" data-nora-prompt="Quiz me on this">QUIZ ME</button></div>`;
  return body;
}
function noraStudyContext(q,retrieval){

}

    else if(last.type==='nora')setPage(renderNora());

    else if(last.type==='study')setPage(renderStudy());else if(last.type==='guide')viewGuide(last.id,false);else if(last.type==='quiz-session')setPage(renderQuizQuestion());else if(last.type==='quiz-setup')setPage(renderQuizSetup(last.prefill||''));
    else if(last.type==='resource-notes'){
      const t=nav.find(x=>x.type==='topic'), s=t?objectiveData[t.i]:objectiveData.find(x=>x.title===last.section);
      if(s){const o=s.objectives.find(x=>String(x.number)===String(last.objective));if(o){setPage(renderObjective(o,s));renderObjectiveResources(s,o).then(v=>{const box=document.querySelector('.objective-resource-slot');if(box)box.innerHTML=v;});}}
    }
  }else{
    closePage();
  }
}
