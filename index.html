function closeSearch(){document.body.classList.remove('searching');searchInput.value='';results.innerHTML='';searchInput.blur()}
function searchData(){const q=searchInput.value.trim().toLowerCase();if(!q){results.innerHTML='';return}const all=[]; const resourceHits=[]; (window.nurseHubChunks||[]).forEach(c=>{if((c.content||'').toLowerCase().includes(q))resourceHits.push({type:'resource-chunk',resourceId:c.resource_id,label:c.heading||'Resource section',detail:(c.content||'').slice(0,140)});});
 objectiveData.forEach((topic,si)=>{if((topic.title+' '+topic.references.join(' ')).toLowerCase().includes(q))all.push({type:'topic',si,label:topic.title,detail:`${topic.objectives.length} objectives`});topic.objectives.forEach((o,oi)=>{const hay=(topic.title+' '+o.text+' '+o.subitems.join(' ')+' '+o.courseObjectives).toLowerCase();if(hay.includes(q))all.push({type:'objective',si,oi,label:`Objective ${o.number} · ${topic.title}`,detail:o.text})})});
 Object.values(labData).flat().forEach(l=>{const low=(l.low.label+' '+l.low.info+' '+l.low.risks.join(' ')+' '+l.low.causes.join(' ')+' '+l.low.meds.join(' ')+' '+l.low.care.join(' ')).toLowerCase();const high=(l.high.label+' '+l.high.info+' '+l.high.risks.join(' ')+' '+l.high.causes.join(' ')+' '+l.high.meds.join(' ')+' '+l.high.care.join(' ')).toLowerCase();const base=(l.name+' '+l.abbr+' '+l.range+' '+l.why).toLowerCase();if(base.includes(q))all.push({type:'lab',id:l.id,label:`${l.name}${l.abbr?' ('+l.abbr+')':''}`,detail:l.range});if(low.includes(q))all.push({type:'lab-section',id:l.id,section:'low',label:`${l.low.label} · ${l.name}`,detail:`${l.name} → ${l.low.label}`});if(high.includes(q))all.push({type:'lab-section',id:l.id,section:'high',label:`${l.high.label} · ${l.name}`,detail:`${l.name} → ${l.high.label}`});});
 Object.values(testData).flat().forEach(t=>{if((t.name+' '+t.why+' '+t.prep+' '+t.nursing.join(' ')+' '+t.cautions.join(' ')).toLowerCase().includes(q))all.push({type:'test',id:t.id,label:t.name,detail:t.why})});
 medicationIndex.forEach(m=>{const hay=[m.name,m.brand,m.className,m.indications,m.action,...m.common,...m.adverse,m.contra,...m.precautions,...m.nursing,...m.teaching,...(m.keywords||[])].join(' ').toLowerCase();if(hay.includes(q))all.push({type:'medication',id:m.id,label:m.name,detail:`${m.className}${m.brand?' · '+m.brand:''}`})});
 const cardsFound=Object.entries(sections).filter(([id,x])=>(id+' '+x.title+' '+x.description).toLowerCase().includes(q)).map(([id,x])=>({type:'dashboard',id,label:x.title,detail:x.description}));
 const resultsAll=[...cardsFound,...all,...resourceHits].slice(0,40);if(!resultsAll.length){results.innerHTML='<div class="no-results">No results found</div>';return}results.innerHTML=resultsAll.map((r,n)=>`<button class="result" data-search-index="${n}"><span class="result-icon">${r.type==='dashboard'?(icons[r.id]||icons.objectives):r.type==='medication'?icons.medications:r.type==='lab'||r.type==='lab-section'||r.type==='test'?icons.diagnostics:topicIcon()}</span><span class="result-text"><strong>${esc(r.label)}</strong><span>${esc(r.detail)}</span></span></button>`).join('');results.querySelectorAll('.result').forEach((el,i)=>el.addEventListener('click',()=>{const r=resultsAll[i];if(r.type==='resource-chunk'){closeSearch();openSettings();setTimeout(()=>{toastMsg('Open Resource Hopper to view this resource section.');},120);return}else if(r.type==='dashboard'){closeSearch();if(r.id==='diagnostics')openDiagnostics();else if(r.id==='medications')openMedications();else openPlaceholder(r.id);}else if(r.type==='medication'){closeSearch();openMedications();setTimeout(()=>openMedication(r.id),20)}else if(r.type==='lab'){closeSearch();openDiagnostics('labs');setTimeout(()=>{const g=Object.keys(labData).find(k=>findLab(r.id,k));if(g){nav.push({type:'lab',id:r.id,group:g});setPage(renderLabDetail(findLab(r.id,g)));}},20)}else if(r.type==='lab-section'){closeSearch();openDiagnostics('labs');setTimeout(()=>{const g=Object.keys(labData).find(k=>findLab(r.id,k));if(g){nav.push({type:'lab',id:r.id,group:g});setPage(renderLabDetail(findLab(r.id,g)));setTimeout(()=>document.getElementById(r.id+'-'+r.section)?.scrollIntoView({behavior:'smooth',block:'start'}),30);}},20)}else if(r.type==='test'){closeSearch();openDiagnostics('tests');setTimeout(()=>{const g=Object.keys(testData).find(k=>findTest(r.id,k));if(g){nav.push({type:'test',id:r.id,group:g});setPage(renderTestDetail(findTest(r.id,g)));}},20)}else if(r.type==='topic'){closeSearch();openObjectives();setTimeout(()=>openTopic(r.si),20)}else{closeSearch();openObjectives();setTimeout(()=>{openTopic(r.si);setTimeout(()=>openObjective(r.oi),20)},20)}}))}

// NORA listeners are additive and run in capture phase so they do not alter existing Nurse Hub handlers.
document.addEventListener('click',e=>{
  const launcher=e.target.closest('#noraLauncher');
  if(launcher){e.preventDefault();e.stopPropagation();window.openNora?.();return;}
  const action=e.target.closest('[data-action="nora"]');
  if(action){e.preventDefault();e.stopPropagation();window.openNora?.();return;}
  const navBtn=e.target.closest('[data-nora-nav]');
  if(navBtn){e.preventDefault();e.stopPropagation();try{window.noraRenderNavigation(JSON.parse(navBtn.dataset.noraNav));}catch(err){console.warn(err)}return;}
  const match=e.target.closest('[data-nora-match]');
  if(match){e.preventDefault();e.stopPropagation();const ctx=window.noraContext?.retrieval;const m=ctx?.matches?.[Number(match.dataset.noraMatch)];if(m)window.noraNavigateMatch(m);return;}
  const qbtn=e.target.closest('[data-nora-open-quiz]');
  if(qbtn){e.preventDefault();e.stopPropagation();window.openQuizSetup(qbtn.dataset.noraOpenQuiz||'');return;}
},true);
