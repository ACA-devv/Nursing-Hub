<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0D0F">
<title>Nurse Hub</title>
<style>
:root{
  --bg:#0B0D0F;--card:#171A1D;--surface:#202428;
  --text:#F2F4F5;--muted:#929AA1;--cyan:#39D5E8;
  --border:rgba(255,255,255,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}button{border:0}
.app{width:100%;max-width:720px;min-height:100vh;margin:auto;
padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
.header{text-align:center;padding-top:18px;margin-bottom:24px}
.brand{margin:0;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-1.2px}
.subtitle{margin:7px 0 0;color:var(--muted);font-size:14px;font-weight:500}
.search-wrap{position:relative;z-index:20;margin:0 auto 26px}
.search-button{width:100%;height:50px;display:flex;align-items:center;gap:11px;padding:0 16px;
color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:16px;
cursor:text;text-align:left;transition:.28s ease;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.search-button:active{transform:scale(.985)}
.search-icon{width:19px;height:19px;flex:none;stroke:currentColor}
.search-placeholder{font-size:15px;font-weight:500}
.search-input{display:none;width:100%;min-width:0;background:transparent;color:var(--text);
border:0;outline:0;padding:0;font-size:16px}
.search-input::placeholder{color:var(--muted)}
.search-cancel{display:none;flex:none;width:30px;height:30px;border-radius:50%;
background:rgba(255,255,255,.08);color:var(--muted);align-items:center;justify-content:center}
.search-results{display:none;margin-top:10px;overflow:hidden;border-radius:16px;background:var(--card);
border:1px solid var(--border);box-shadow:0 14px 35px rgba(0,0,0,.28)}
.result{width:100%;display:flex;align-items:center;gap:13px;padding:14px 15px;color:var(--text);
background:transparent;text-align:left;border-bottom:1px solid var(--border)}
.result:last-child{border-bottom:0}
.result:active{background:var(--surface)}
.result-icon{width:35px;height:35px;flex:none;display:grid;place-items:center;color:var(--cyan);
background:rgba(57,213,232,.08);border-radius:10px}
.result-icon svg{width:18px;height:18px}
.result-text strong{display:block;font-size:15px;font-weight:600}
.result-text span{display:block;margin-top:3px;color:var(--muted);font-size:12px}
.no-results{padding:18px;color:var(--muted);text-align:center;font-size:14px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{position:relative;min-height:155px;padding:18px;display:flex;flex-direction:column;
justify-content:space-between;background:var(--card);border:1px solid var(--border);
border-radius:21px;box-shadow:0 14px 35px rgba(0,0,0,.28);cursor:pointer;overflow:hidden;
transform-origin:center;transition:transform .26s cubic-bezier(.2,.8,.2,1),border-color .26s ease,box-shadow .26s ease}
.card:active{transform:scale(.975)}
.card.active{transform:scale(1.025);border-color:rgba(57,213,232,.42);
box-shadow:0 18px 45px rgba(0,0,0,.42),0 0 28px rgba(57,213,232,.08)}
.icon-box{width:42px;height:42px;display:grid;place-items:center;color:var(--cyan);
background:rgba(57,213,232,.08);border-radius:13px;transition:.36s cubic-bezier(.2,.8,.2,1)}
.icon-box svg{width:22px;height:22px}
.card.active .icon-box{transform:rotate(360deg) scale(1.08)}
.card-copy{margin-top:16px}
.card-title{display:block;margin:0;font-size:17px;line-height:1.15;font-weight:650;letter-spacing:-.25px}
.card-description{display:block;margin-top:7px;color:var(--muted);font-size:12.5px;line-height:1.35}

.page{position:fixed;z-index:50;inset:0;min-height:100vh;background:var(--bg);
transform:translateY(100%);opacity:0;pointer-events:none;transition:transform .42s cubic-bezier(.22,.8,.2,1),opacity .28s ease;
overflow-y:auto}
.page.open{transform:translateY(0);opacity:1;pointer-events:auto}
.page-inner{width:100%;max-width:720px;min-height:100vh;margin:auto;
padding:max(18px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom))}
.back-button{width:42px;height:42px;margin-top:5px;display:grid;place-items:center;border-radius:50%;
color:var(--text);background:var(--surface);border:1px solid var(--border)}
.detail-content{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding-bottom:12vh}
.detail-icon{width:76px;height:76px;display:grid;place-items:center;color:var(--cyan);
background:rgba(57,213,232,.08);border:1px solid rgba(57,213,232,.12);border-radius:24px;margin-bottom:25px}
.detail-icon svg{width:35px;height:35px}
.detail-title{margin:0;font-size:29px;font-weight:700;letter-spacing:-.7px}
.coming-soon{margin:9px 0 0;color:var(--muted);font-size:15px;font-weight:500}
@keyframes detailIn{from{opacity:0;transform:scale(.65) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}

.search-dimmer{position:fixed;z-index:10;inset:0;background:rgba(0,0,0,.58);opacity:0;
pointer-events:none;transition:opacity .28s ease;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
body.searching .search-dimmer{opacity:1;pointer-events:auto}
body.searching .search-wrap{position:fixed;top:max(20px,env(safe-area-inset-top));left:18px;right:18px;
max-width:684px;margin:auto}
body.searching .search-button{height:56px;background:#171A1D;border-color:rgba(57,213,232,.52);
box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 24px rgba(57,213,232,.07)}
body.searching .search-placeholder{display:none}
body.searching .search-input{display:block}
body.searching .search-cancel{display:flex}
body.searching .search-results{display:block}
body.searching .grid,body.searching .header{filter:blur(2px);opacity:.25;transition:.28s ease}
@media(min-width:560px){.grid{gap:16px}.card{min-height:170px;padding:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}}
</style>
</head>
<body>

<main class="app">
<header class="header">
<h1 class="brand">Nurse Hub</h1>
<p class="subtitle">School Dashboard</p>
</header>

<div class="search-dimmer" id="searchDimmer"></div>

<section class="search-wrap">
<button class="search-button" id="searchButton" aria-label="Search Nurse Hub">
<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<span class="search-placeholder">Search Nurse Hub</span>
<input id="searchInput" class="search-input" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Search Nurse Hub">
<span class="search-cancel" id="searchCancel">
<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</span>
</button>
<div class="search-results" id="searchResults"></div>
</section>

<section class="grid" id="dashboardGrid">

<button class="card" data-id="calendar">
<span class="icon-box">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect x="3.5" y="5" width="17" height="16" rx="2.5"></rect><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17"></path><path d="M8 13h2M14 13h2M8 17h2M14 17h2"></path>
</svg>
</span>
<span class="card-copy"><span class="card-title">Calendar</span><span class="card-description">Class schedule &amp; clinicals</span></span>
</button>

<button class="card" data-id="objectives">
<span class="icon-box">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect x="4" y="3.5" width="16" height="17" rx="2.5"></rect><path d="M8 8h8M8 12h8M8 16h4"></path><path d="M5.8 8.1l.9.9 1.5-1.7"></path>
</svg>
</span>
<span class="card-copy"><span class="card-title">Objectives</span><span class="card-description">Course content</span></span>
</button>

<button class="card" data-id="labs">
<span class="icon-box">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M9 3.5v6.2L4.5 18a2 2 0 0 0 1.8 2.8h11.4a2 2 0 0 0 1.8-2.8L15 9.7V3.5"></path><path d="M8 3.5h8M7 15h10"></path>
</svg>
</span>
<span class="card-copy"><span class="card-title">Lab Values</span><span class="card-description">Nursing reference ranges</span></span>
</button>

<button class="card" data-id="medications">
<span class="icon-box">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M8.1 4.6a4.2 4.2 0 0 1 5.9 0l5.4 5.4a4.2 4.2 0 0 1 0 5.9l-3.5 3.5a4.2 4.2 0 0 1-5.9 0l-5.4-5.4a4.2 4.2 0 0 1 0-5.9z"></path><path d="M7.2 8.2l8.6 8.6"></path>
</svg>
</span>
<span class="card-copy"><span class="card-title">Medications</span><span class="card-description">Drug information &amp; notes</span></span>
</button>

<button class="card" data-id="quiz">
<span class="icon-box">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M8.2 4.2A7.5 7.5 0 0 1 19.5 10c1.3 5.1-2.9 9.8-8.1 9.8-4.6 0-8.4-3.7-8.4-8.4 0-3.2 1.8-6 4.5-7.5"></path><path d="M8.8 9a3.1 3.1 0 0 1 3.1-2.4c1.7 0 3 .9 3 2.4 0 1.8-1.5 2.3-2.5 3.1-.7.5-1 1-.9 1.8"></path><path d="M11.6 17h.01"></path>
</svg>
</span>
<span class="card-copy"><span class="card-title">Quiz Me</span><span class="card-description">Practice active recall</span></span>
</button>

<button class="card" data-id="materials">
<span class="icon-box">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M4.5 5.5A2.5 2.5 0 0 1 7 3h11.5v17H7a2.5 2.5 0 0 0-2.5 2.5z"></path><path d="M4.5 5.5v15M8 7h7M8 10.5h7M8 14h5"></path>
</svg>
</span>
<span class="card-copy"><span class="card-title">Study Materials</span><span class="card-description">Notes, guides &amp; resources</span></span>
</button>

</section>
</main>

<section class="page" id="detailPage" aria-hidden="true">
<div class="page-inner">
<button class="back-button" id="backButton" aria-label="Go back">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<div class="detail-content">
<div class="detail-icon" id="detailIcon"></div>
<h2 class="detail-title" id="detailTitle"></h2>
<p class="coming-soon">Coming Soon</p>
</div>
</div>
</section>

<script>
const sections={
calendar:{title:"Calendar",description:"Class schedule & clinicals"},
objectives:{title:"Objectives",description:"Course content"},
labs:{title:"Lab Values",description:"Nursing reference ranges"},
medications:{title:"Medications",description:"Drug information & notes"},
quiz:{title:"Quiz Me",description:"Practice active recall"},
materials:{title:"Study Materials",description:"Notes, guides & resources"}
};

const cards=document.querySelectorAll(".card");
const page=document.getElementById("detailPage");
const detailIcon=document.getElementById("detailIcon");
const detailTitle=document.getElementById("detailTitle");
const back=document.getElementById("backButton");
const searchButton=document.getElementById("searchButton");
const searchInput=document.getElementById("searchInput");
const searchCancel=document.getElementById("searchCancel");
const results=document.getElementById("searchResults");
const dimmer=document.getElementById("searchDimmer");

function openPage(id,source){
  const s=sections[id];
  if(!s)return;
  closeSearch();
  if(source)source.classList.add("active");
  setTimeout(()=>{
    detailTitle.textContent=s.title;
    detailIcon.innerHTML=source ? source.querySelector(".icon-box").innerHTML : "";
    page.classList.add("open");
    page.setAttribute("aria-hidden","false");
    detailIcon.style.animation="none";
    void detailIcon.offsetWidth;
    detailIcon.style.animation="detailIn .5s cubic-bezier(.2,.8,.2,1) both";
  },120);
}

cards.forEach(card=>card.addEventListener("click",()=>openPage(card.dataset.id,card)));

function closePage(){
  page.classList.remove("open");
  page.setAttribute("aria-hidden","true");
  cards.forEach(c=>c.classList.remove("active"));
}

back.addEventListener("click",closePage);

function closeSearch(){
  document.body.classList.remove("searching");
  searchInput.value="";
  results.innerHTML="";
  searchInput.blur();
}

function renderResults(){
  const q=searchInput.value.trim().toLowerCase();
  if(!q){results.innerHTML="";return;}
  const matches=Object.entries(sections).filter(([id,s])=>
    (id+" "+s.title+" "+s.description).toLowerCase().includes(q)
  );
  if(!matches.length){
    results.innerHTML='<div class="no-results">No results found</div>';
    return;
  }

  results.innerHTML=matches.map(([id,s])=>{
    const source=document.querySelector('[data-id="'+id+'"]');
    return `<button class="result" data-id="${id}">
      <span class="result-icon">${source.querySelector(".icon-box").innerHTML}</span>
      <span class="result-text"><strong>${s.title}</strong><span>${s.description}</span></span>
    </button>`;
  }).join("");

  results.querySelectorAll(".result").forEach(r=>
    r.addEventListener("click",()=>openPage(r.dataset.id))
  );
}

searchButton.addEventListener("click",e=>{
  if(!document.body.classList.contains("searching")){
    e.preventDefault();
    document.body.classList.add("searching");
    setTimeout(()=>{
      searchInput.focus();
      renderResults();
    },20);
  }
});

searchInput.addEventListener("input",renderResults);

searchCancel.addEventListener("click",e=>{
  e.stopPropagation();
  closeSearch();
});

dimmer.addEventListener("click",closeSearch);

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(page.classList.contains("open"))closePage();
    else if(document.body.classList.contains("searching"))closeSearch();
  }
});
</script>
</body>
</html>
