<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0D0F">
<title>Nurse Hub</title>
<style>
:root{--bg:#0B0D0F;--card:#171A1D;--surface:#202428;--text:#F2F4F5;--muted:#929AA1;--cyan:#39D5E8;--border:rgba(255,255,255,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{overflow-x:hidden}button,input{font:inherit}button{border:0}.app{width:100%;max-width:720px;min-height:100vh;margin:auto;padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
.header{text-align:center;padding-top:18px;margin-bottom:24px}.brand{margin:0;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-1.2px}.subtitle{margin:7px 0 0;color:var(--muted);font-size:14px;font-weight:500}
.search-wrap{position:relative;z-index:20;margin:0 auto 26px}.search-button{width:100%;height:50px;display:flex;align-items:center;gap:11px;padding:0 16px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:16px;cursor:text;text-align:left;transition:.28s ease;box-shadow:0 8px 22px rgba(0,0,0,.12)}.search-button:active{transform:scale(.985)}.search-icon{width:19px;height:19px;flex:none;stroke:currentColor}.search-placeholder{font-size:15px;font-weight:500}.search-input{display:none;width:100%;min-width:0;background:transparent;color:var(--text);border:0;outline:0;padding:0;font-size:16px}.search-input::placeholder{color:var(--muted)}.search-cancel{display:none;flex:none;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--muted);align-items:center;justify-content:center}.search-results{display:none;margin-top:10px;overflow:hidden;border-radius:16px;background:var(--card);border:1px solid var(--border);box-shadow:0 14px 35px rgba(0,0,0,.28);max-height:70vh;overflow-y:auto}.result{width:100%;display:flex;align-items:center;gap:13px;padding:14px 15px;color:var(--text);background:transparent;text-align:left;border-bottom:1px solid var(--border)}.result:last-child{border-bottom:0}.result:active{background:var(--surface)}.result-icon{width:35px;height:35px;flex:none;display:grid;place-items:center;color:var(--cyan);background:rgba(57,213,232,.08);border-radius:10px}.result-icon svg{width:18px;height:18px}.result-text strong{display:block;font-size:15px;font-weight:600}.result-text span{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.3}.no-results{padding:18px;color:var(--muted);text-align:center;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{position:relative;min-height:155px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:21px;box-shadow:0 14px 35px rgba(0,0,0,.28);cursor:pointer;overflow:hidden;transform-origin:center;transition:transform .26s cubic-bezier(.2,.8,.2,1),border-color .26s ease,box-shadow .26s ease}.card:active{transform:scale(.975)}.card.active{transform:scale(1.025);border-color:rgba(57,213,232,.42);box-shadow:0 18px 45px rgba(0,0,0,.42),0 0 28px rgba(57,213,232,.08)}.icon-box{width:42px;height:42px;display:grid;place-items:center;color:var(--cyan);background:rgba(57,213,232,.08);border-radius:13px;transition:.36s cubic-bezier(.2,.8,.2,1)}.icon-box svg{width:22px;height:22px}.card.active .icon-box{transform:rotate(360deg) scale(1.08)}.card-copy{margin-top:16px}.card-title{display:block;margin:0;font-size:17px;line-height:1.15;font-weight:650;letter-spacing:-.25px}.card-description{display:block;margin-top:7px;color:var(--muted);font-size:12.5px;line-height:1.35}
.page{position:fixed;z-index:50;inset:0;min-height:100vh;background:var(--bg);transform:translateY(100%);opacity:0;pointer-events:none;transition:transform .42s cubic-bezier(.22,.8,.2,1),opacity .28s ease;overflow-y:auto}.page.open{transform:translateY(0);opacity:1;pointer-events:auto}.page-inner{width:100%;max-width:720px;min-height:100vh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom))}.back-button{width:42px;height:42px;margin-top:5px;display:grid;place-items:center;border-radius:50%;color:var(--text);background:var(--surface);border:1px solid var(--border);cursor:pointer}.page-header{padding:34px 4px 22px}.page-kicker{color:var(--cyan);font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}.page-title{margin:0;font-size:30px;line-height:1.08;font-weight:700;letter-spacing:-.7px}.page-subtitle{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.45}.list{display:grid;gap:11px}.list-card{width:100%;padding:16px 16px;display:flex;align-items:center;gap:13px;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:17px;box-shadow:0 10px 25px rgba(0,0,0,.2);cursor:pointer;transition:.22s ease}.list-card:active{transform:scale(.985);background:var(--surface)}.list-number{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:11px;color:var(--cyan);background:rgba(57,213,232,.08);font-size:13px;font-weight:700}.list-copy{min-width:0}.list-title{display:block;font-size:15px;font-weight:600;line-height:1.3}.list-meta{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.3}.chevron{margin-left:auto;color:var(--muted);font-size:20px;flex:none}.topic-card .list-number{font-size:11px}.objective-text{margin:0;color:var(--text);font-size:16px;line-height:1.65}.objective-subitems{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:9px}.objective-subitems li{padding:11px 13px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:#D8DDE0;font-size:14px;line-height:1.5}.objective-meta{display:grid;gap:10px;margin-top:24px}.meta-box{padding:14px 15px;background:var(--card);border:1px solid var(--border);border-radius:15px}.meta-label{display:block;color:var(--cyan);font-size:10px;font-weight:700;letter-spacing:.75px;text-transform:uppercase;margin-bottom:6px}.meta-value{color:#D9DEE1;font-size:13px;line-height:1.5}.reference-list{margin:0;padding-left:18px;color:#C8CED2;font-size:13px;line-height:1.5}.action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:28px}.action-button{min-height:52px;padding:8px 6px;border-radius:15px;background:var(--surface);border:1px solid rgba(57,213,232,.18);color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.55px;cursor:pointer}.action-button:active{transform:scale(.97)}.source-note{margin:24px 2px 0;color:#6F777D;font-size:11px;line-height:1.45;text-align:center}.empty{padding:30px 18px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:17px}
.detail-content{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:12vh}.detail-icon{width:76px;height:76px;display:grid;place-items:center;color:var(--cyan);background:rgba(57,213,232,.08);border:1px solid rgba(57,213,232,.12);border-radius:24px;margin-bottom:25px}.detail-icon svg{width:35px;height:35px}.detail-title{margin:0;font-size:29px;font-weight:700;letter-spacing:-.7px}.coming-soon{margin:9px 0 0;color:var(--muted);font-size:15px;font-weight:500}
.search-dimmer{position:fixed;z-index:10;inset:0;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;transition:opacity .28s ease;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}body.searching .search-dimmer{opacity:1;pointer-events:auto}body.searching .search-wrap{position:fixed;top:max(20px,env(safe-area-inset-top));left:18px;right:18px;max-width:684px;margin:auto}body.searching .search-button{height:56px;background:#171A1D;border-color:rgba(57,213,232,.52);box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 24px rgba(57,213,232,.07)}body.searching .search-placeholder{display:none}body.searching .search-input{display:block}body.searching .search-cancel{display:flex}body.searching .search-results{display:block}body.searching .grid,body.searching .header{filter:blur(2px);opacity:.25;transition:.28s ease}
.toast{position:fixed;z-index:100;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#202428;border:1px solid var(--border);box-shadow:0 14px 35px rgba(0,0,0,.35);color:var(--text);padding:12px 15px;border-radius:13px;font-size:13px;white-space:nowrap;transition:.25s ease}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:560px){.grid{gap:16px}.card{min-height:170px;padding:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}}
</style>
</head>

async function decodeObjectiveData(){
  const bytes=Uint8Array.from(atob(objectiveDataCompressed),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  const text=await new Response(stream).text();
  return JSON.parse(text);
}

async function init(){
  const objectiveData=await decodeObjectiveData();
  const cards=document.querySelectorAll('.card'),page=document.getElementById('detailPage'),content=document.getElementById('pageContent'),back=document.getElementById('backButton'),searchButton=document.getElementById('searchButton'),searchInput=document.getElementById('searchInput'),searchCancel=document.getElementById('searchCancel'),results=document.getElementById('searchResults'),dimmer=document.getElementById('searchDimmer'),toast=document.getElementById('toast');
let nav=[],toastTimer;
const icons={calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="16" rx="2.5"></rect><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17M8 13h2M14 13h2M8 17h2M14 17h2"></path></svg>',objectives:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3.5" width="16" height="17" rx="2.5"></rect><path d="M8 8h8M8 12h8M8 16h4M5.8 8.1l.9.9 1.5-1.7"></path></svg>',labs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3.5v6.2L4.5 18a2 2 0 0 0 1.8 2.8h11.4a2 2 0 0 0 1.8-2.8L15 9.7V3.5M8 3.5h8M7 15h10"></path></svg>',medications:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8.1 4.6a4.2 4.2 0 0 1 5.9 0l5.4 5.4a4.2 4.2 0 0 1 0 5.9l-3.5 3.5a4.2 4.2 0 0 1-5.9 0l-5.4-5.4a4.2 4.2 0 0 1 0-5.9zM7.2 8.2l8.6 8.6"></path></svg>',quiz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8.2 4.2A7.5 7.5 0 0 1 19.5 10c1.3 5.1-2.9 9.8-8.1 9.8-4.6 0-8.4-3.7-8.4-8.4 0-3.2 1.8-6 4.5-7.5"></path><path d="M8.8 9a3.1 3.1 0 0 1 3.1-2.4c1.7 0 3 .9 3 2.4 0 1.8-1.5 2.3-2.5 3.1-.7.5-1 1-.9 1.8M11.6 17h.01"></path></svg>',materials:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 5.5A2.5 2.5 0 0 1 7 3h11.5v17H7a2.5 2.5 0 0 0-2.5 2.5zM4.5 5.5v15M8 7h7M8 10.5h7M8 14h5"></path></svg>'};
function showPage(){page.classList.add('open');page.setAttribute('aria-hidden','false')}
function closePage(){page.classList.remove('open');page.setAttribute('aria-hidden','true');nav=[];cards.forEach(c=>c.classList.remove('active'))}
function setPage(html){content.innerHTML=html;showPage();content.scrollIntoView({block:'start'});}
function topicIcon(){return icons.objectives}
function openObjectives(){nav=[{type:'root'}];setPage(renderTopics())}
function renderTopics(){return `<div class="page-header"><div class="page-kicker">Objectives</div><h2 class="page-title">NUR 2129</h2><p class="page-subtitle">Maternal Child Nursing · ${objectiveData.length} class/topic sections</p></div><div class="list">${objectiveData.map((s,i)=>`<button class="list-card topic-card" data-topic="${i}"><span class="list-number">${String(i+1).padStart(2,'0')}</span><span class="list-copy"><span class="list-title">${esc(s.title)}</span><span class="list-meta">${s.objectives.length} objectives</span></span><span class="chevron">›</span></button>`).join('')}</div><p class="source-note">Content is based on the provided NUR 2129 objectives document. Formatting has been cleaned up for the app while retaining the source wording and references.</p>`}
function openTopic(i){nav.push({type:'topic',i});setPage(renderTopic(objectiveData[i],i))}
function renderTopic(s,i){return `<div class="page-header"><div class="page-kicker">NUR 2129 · Topic ${i+1}</div><h2 class="page-title">${esc(s.title)}</h2><p class="page-subtitle">Select an objective to view its details, course-objective mapping, references, and future study tools.</p></div><div class="list">${s.objectives.map((o,j)=>`<button class="list-card" data-objective="${j}"><span class="list-number">${o.number}</span><span class="list-copy"><span class="list-title">${esc(o.text)}</span><span class="list-meta">${o.courseObjectives?'Course objective '+esc(o.courseObjectives):'Objective'}</span></span><span class="chevron">›</span></button>`).join('')}</div>`}
function openObjective(j){const t=nav.find(x=>x.type==='topic');const s=objectiveData[t.i];nav.push({type:'objective',j});setPage(renderObjective(s.objectives[j],s))}
function renderObjective(o,s){return `<div class="page-header"><div class="page-kicker">${esc(s.title)} · Objective ${o.number}</div><h2 class="page-title">Objective ${o.number}</h2></div><div class="meta-box"><p class="objective-text">${esc(o.text)}</p>${o.subitems.length?`<ul class="objective-subitems">${o.subitems.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div><div class="objective-meta">${o.courseObjectives?`<div class="meta-box"><span class="meta-label">Course Objective Mapping</span><div class="meta-value">Course objective ${esc(o.courseObjectives)}</div></div>`:''}${s.references.length?`<div class="meta-box"><span class="meta-label">Textbooks / References</span><ul class="reference-list">${s.references.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`:''}</div><div class="action-row"><button class="action-button" data-action="study">STUDY</button><button class="action-button" data-action="quiz">QUIZ ME</button><button class="action-button" data-action="nora">ASK NORA</button></div><p class="source-note">These tools are intentionally wired into the objective screen now so they can be connected later without changing the objective architecture.</p>`}
function openPlaceholder(id,source){closeSearch();if(source)source.classList.add('active');setTimeout(()=>{setPage(`<div class="detail-content"><div class="detail-icon">${icons[id]||icons.objectives}</div><h2 class="detail-title">${esc(sections[id].title)}</h2><p class="coming-soon">Coming Soon</p></div>`)},120)}
function goBack(){if(nav.length>1){nav.pop();const last=nav[nav.length-1];if(last.type==='root')setPage(renderTopics());else if(last.type==='topic')setPage(renderTopic(objectiveData[last.i],last.i));else if(last.type==='objective'){const t=nav.find(x=>x.type==='topic');setPage(renderObjective(objectiveData[t.i].objectives[last.j],objectiveData[t.i]))}}else closePage()}
function toastMsg(msg){clearTimeout(toastTimer);toast.textContent=msg;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

document.addEventListener('click',e=>{const card=e.target.closest('.card');if(card){if(card.dataset.id==='objectives')openObjectives();else openPlaceholder(card.dataset.id,card);return}const topic=e.target.closest('[data-topic]');if(topic){openTopic(Number(topic.dataset.topic));return}const obj=e.target.closest('[data-objective]');if(obj){openObjective(Number(obj.dataset.objective));return}const act=e.target.closest('[data-action]');if(act){const names={study:'Study mode',quiz:'Objective-specific Quiz Me',nora:'Ask NORA'};toastMsg(names[act.dataset.action]+' is coming next.');return}});
back.addEventListener('click',goBack);
function closeSearch(){document.body.classList.remove('searching');searchInput.value='';results.innerHTML='';searchInput.blur()}
function searchData(){const q=searchInput.value.trim().toLowerCase();if(!q){results.innerHTML='';return}const found=[];objectiveData.forEach((s,si)=>{if((s.title+' '+s.references.join(' ')).toLowerCase().includes(q))found.push({type:'topic',si,label:s.title,detail:`${s.objectives.length} objectives`});s.objectives.forEach((o,oi)=>{const hay=(s.title+' '+o.text+' '+o.subitems.join(' ')+' '+o.courseObjectives).toLowerCase();if(hay.includes(q))found.push({type:'objective',si,oi,label:`Objective ${o.number} · ${s.title}`,detail:o.text})})});const cardsFound=Object.entries(sections).filter(([id,s])=>(id+' '+s.title+' '+s.description).toLowerCase().includes(q)).map(([id,s])=>({type:'dashboard',id,label:s.title,detail:s.description}));const all=[...cardsFound,...found].slice(0,30);if(!all.length){results.innerHTML='<div class="no-results">No results found</div>';return}results.innerHTML=all.map((r,n)=>`<button class="result" data-search-index="${n}"><span class="result-icon">${r.type==='dashboard'?(icons[r.id]||icons.objectives):topicIcon()}</span><span class="result-text"><strong>${esc(r.label)}</strong><span>${esc(r.detail)}</span></span></button>`).join('');results.querySelectorAll('.result').forEach((el,i)=>el.addEventListener('click',()=>{const r=all[i];if(r.type==='dashboard')openPlaceholder(r.id);else if(r.type==='topic'){closeSearch();openObjectives();setTimeout(()=>openTopic(r.si),50)}else{closeSearch();openObjectives();setTimeout(()=>{openTopic(r.si);setTimeout(()=>openObjective(r.oi),50)},50)}}))}
searchButton.addEventListener('click',e=>{if(!document.body.classList.contains('searching')){e.preventDefault();document.body.classList.add('searching');setTimeout(()=>{searchInput.focus();searchData()},20)}});searchInput.addEventListener('input',searchData);searchCancel.addEventListener('click',e=>{e.stopPropagation();closeSearch()});dimmer.addEventListener('click',closeSearch);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(page.classList.contains('open'))goBack();else if(document.body.classList.contains('searching'))closeSearch()}});

}
init();
</script>
</body></html>
