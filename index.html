<!DOCTYPE html>
<html lang="en">

<title>Nurse Hub</title>
<style>
:root{--bg:#0B0D0F;--card:#171A1D;--surface:#202428;--text:#F2F4F5;--muted:#929AA1;--cyan:#39D5E8;--border:rgba(255,255,255,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{overflow-x:hidden}button,input{font:inherit}button{border:0}.app{width:100%;max-width:720px;min-height:100vh;margin:auto;padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
.header{text-align:center;padding-top:18px;margin-bottom:24px}.brand{margin:0;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-1.2px}.subtitle{margin:7px 0 0;color:var(--muted);font-size:14px;font-weight:500}
.search-wrap{position:relative;z-index:20;margin:0 auto 26px}.search-button{width:100%;height:50px;display:flex;align-items:center;gap:11px;padding:0 16px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:16px;cursor:text;text-align:left;transition:.28s ease;box-shadow:0 8px 22px rgba(0,0,0,.12)}.search-button:active{transform:scale(.985)}.search-icon{width:19px;height:19px;flex:none;stroke:currentColor}.search-placeholder{font-size:15px;font-weight:500}.search-input{display:none;width:100%;min-width:0;background:transparent;color:var(--text);border:0;outline:0;padding:0;font-size:16px}.search-input::placeholder{color:var(--muted)}.search-cancel{display:none;flex:none;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--muted);align-items:center;justify-content:center}.search-results{display:none;margin-top:10px;overflow:hidden;border-radius:16px;background:var(--card);border:1px solid var(--border);box-shadow:0 14px 35px rgba(0,0,0,.28);max-height:70vh;overflow-y:auto}.result{width:100%;display:flex;align-items:center;gap:13px;padding:14px 15px;color:var(--text);background:transparent;text-align:left;border-bottom:1px solid var(--border)}.result:last-child{border-bottom:0}.result:active{background:var(--surface)}.result-icon{width:35px;height:35px;flex:none;display:grid;place-items:center;color:var(--cyan);background:rgba(57,213,232,.08);border-radius:10px}.result-icon svg{width:18px;height:18px}.result-text strong{display:block;font-size:15px;font-weight:600}.result-text span{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.3}.no-results{padding:18px;color:var(--muted);text-align:center;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{position:relative;min-height:155px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:21px;box-shadow:0 14px 35px rgba(0,0,0,.28);cursor:pointer;overflow:hidden;transform-origin:center;transition:transform .26s cubic-bezier(.2,.8,.2,1),border-color .26s ease,box-shadow .26s ease}.card:active{transform:scale(.975)}.card.active{transform:scale(1.025);border-color:rgba(57,213,232,.42);box-shadow:0 18px 45px rgba(0,0,0,.42),0 0 28px rgba(57,213,232,.08)}.icon-box{width:42px;height:42px;display:grid;place-items:center;color:var(--cyan);background:rgba(57,213,232,.08);border-radius:13px;transition:.36s cubic-bezier(.2,.8,.2,1)}.icon-box svg{width:22px;height:22px}.card.active .icon-box{transform:rotate(360deg) scale(1.08)}.card-copy{margin-top:16px}.card-title{display:block;margin:0;font-size:17px;line-height:1.15;font-weight:650;letter-spacing:-.25px}.card-description{display:block;margin-top:7px;color:var(--muted);font-size:12.5px;line-height:1.35}
.page{position:fixed;z-index:50;inset:0;min-height:100vh;background:var(--bg);transform:translateY(100%);opacity:0;pointer-events:none;transition:transform .42s cubic-bezier(.22,.8,.2,1),opacity .28s ease;overflow-y:auto}.page.open{transform:translateY(0);opacity:1;pointer-events:auto}.page-inner{width:100%;max-width:720px;min-height:100vh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom))}.back-button{width:42px;height:42px;margin-top:5px;display:grid;place-items:center;border-radius:50%;color:var(--text);background:var(--surface);border:1px solid var(--border);cursor:pointer}.page-header{padding:34px 4px 22px}.page-kicker{color:var(--cyan);font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}.page-title{margin:0;font-size:30px;line-height:1.08;font-weight:700;letter-spacing:-.7px}.page-subtitle{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.45}.list{display:grid;gap:11px}.list-card{width:100%;padding:16px 16px;display:flex;align-items:center;gap:13px;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:17px;box-shadow:0 10px 25px rgba(0,0,0,.2);cursor:pointer;transition:.22s ease}.list-card:active{transform:scale(.985);background:var(--surface)}.list-number{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:11px;color:var(--cyan);background:rgba(57,213,232,.08);font-size:13px;font-weight:700}.list-copy{min-width:0}.list-title{display:block;font-size:15px;font-weight:600;line-height:1.3}.list-meta{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.3}.chevron{margin-left:auto;color:var(--muted);font-size:20px;flex:none}.topic-card .list-number{font-size:11px}.objective-text{margin:0;color:var(--text);font-size:16px;line-height:1.65}.objective-subitems{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:9px}.objective-subitems li{padding:11px 13px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:#D8DDE0;font-size:14px;line-height:1.5}.objective-meta{display:grid;gap:10px;margin-top:24px}.meta-box{padding:14px 15px;background:var(--card);border:1px solid var(--border);border-radius:15px}.meta-label{display:block;color:var(--cyan);font-size:10px;font-weight:700;letter-spacing:.75px;text-transform:uppercase;margin-bottom:6px}.meta-value{color:#D9DEE1;font-size:13px;line-height:1.5}.reference-list{margin:0;padding-left:18px;color:#C8CED2;font-size:13px;line-height:1.5}.action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:28px}.action-button{min-height:52px;padding:8px 6px;border-radius:15px;background:var(--surface);border:1px solid rgba(57,213,232,.18);color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.55px;cursor:pointer}.action-button:active{transform:scale(.97)}.source-note{margin:24px 2px 0;color:#6F777D;font-size:11px;line-height:1.45;text-align:center}.empty{padding:30px 18px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:17px}
.diagnostic-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 20px}.diagnostic-tab{min-height:58px;padding:10px 12px;border-radius:15px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.6px;cursor:pointer}.diagnostic-tab.active{color:var(--cyan);border-color:rgba(57,213,232,.35);background:rgba(57,213,232,.06)}.diagnostic-tab small{display:block;margin-top:4px;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:0;text-transform:none}.diagnostic-category{margin:22px 0 10px;padding:0 3px;color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}.diagnostic-range{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}.diagnostic-detail{display:grid;gap:12px}.diagnostic-section{padding:15px;background:var(--card);border:1px solid var(--border);border-radius:15px}.diagnostic-section h3{margin:0 0 8px;font-size:13px;color:var(--cyan);letter-spacing:.15px}.diagnostic-section p{margin:0;color:#D8DDE0;font-size:13px;line-height:1.55}.diagnostic-section ul{margin:0;padding-left:18px;color:#D8DDE0;font-size:13px;line-height:1.55}.diagnostic-section li+li{margin-top:5px}.diagnostic-alert{border-left:2px solid rgba(57,213,232,.45)}.diagnostic-links{display:grid;gap:8px}.diagnostic-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);text-align:left;cursor:pointer}.diagnostic-link span{font-size:13px}.diagnostic-link small{color:var(--muted);font-size:11px}.test-badge{width:auto;min-width:34px;padding:0 8px}..detail-content{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:12vh}.detail-icon{width:76px;height:76px;display:grid;place-items:center;color:var(--cyan);background:rgba(57,213,232,.08);border:1px solid rgba(57,213,232,.12);border-radius:24px;margin-bottom:25px}.detail-icon svg{width:35px;height:35px}.detail-title{margin:0;font-size:29px;font-weight:700;letter-spacing:-.7px}.coming-soon{margin:9px 0 0;color:var(--muted);font-size:15px;font-weight:500}
.search-dimmer{position:fixed;z-index:10;inset:0;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;transition:opacity .28s ease;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}body.searching .search-dimmer{opacity:1;pointer-events:auto}body.searching .search-wrap{position:fixed;top:max(20px,env(safe-area-inset-top));left:18px;right:18px;max-width:684px;margin:auto}body.searching .search-button{height:56px;background:#171A1D;border-color:rgba(57,213,232,.52);box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 24px rgba(57,213,232,.07)}body.searching .search-placeholder{display:none}body.searching .search-input{display:block}body.searching .search-cancel{display:flex}body.searching .search-results{display:block}body.searching .grid,body.searching .header{filter:blur(2px);opacity:.25;transition:.28s ease}
.toast{position:fixed;z-index:100;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#202428;border:1px solid var(--border);box-shadow:0 14px 35px rgba(0,0,0,.35);color:var(--text);padding:12px 15px;border-radius:13px;font-size:13px;white-space:nowrap;transition:.25s ease}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:560px){.grid{gap:16px}.card{min-height:170px;padding:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}}

.calendar-toolbar{display:flex;gap:8px;margin:18px 0 14px;overflow-x:auto;padding-bottom:2px}
.calendar-filter{border:1px solid rgba(255,255,255,.09);background:#171A1D;color:#929AA1;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:700;white-space:nowrap}
.calendar-filter.active{color:#0B0D0F;background:#39D5E8;border-color:#39D5E8}
.calendar-section{margin:22px 0}
.calendar-section-title{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#929AA1;margin:0 0 10px}
.calendar-event{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;background:#171A1D;border:1px solid rgba(255,255,255,.06);border-radius:15px;padding:13px 14px;margin:8px 0}
.calendar-date{width:48px;flex:0 0 48px;text-align:center;padding-top:1px}
.calendar-month{font-size:10px;font-weight:800;color:#39D5E8;letter-spacing:.08em;text-transform:uppercase}
.calendar-day{font-size:22px;font-weight:800;color:#F2F4F5;line-height:1.05}
.calendar-dow{font-size:10px;color:#929AA1;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}.no-class-event{opacity:.72}.no-class-event .calendar-event-title{color:#929AA1}
.calendar-info{min-width:0;flex:1}
.calendar-event-title{font-size:14px;font-weight:750;color:#F2F4F5;line-height:1.3}
.calendar-event-meta{font-size:12px;color:#929AA1;margin-top:4px;line-height:1.35}
.calendar-badge{display:inline-flex;margin-top:7px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#39D5E8}
.clinical-card{background:#171A1D;border:1px solid rgba(57,213,232,.13);border-radius:16px;padding:15px;margin:9px 0}
.clinical-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.clinical-type{font-size:15px;font-weight:800;color:#F2F4F5}
.clinical-date{font-size:12px;color:#39D5E8;font-weight:750;text-align:right}
.clinical-place{font-size:12px;color:#929AA1;margin-top:4px}
.clinical-detail{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:#F2F4F5}
.clinical-detail span{color:#929AA1}
.calendar-note{font-size:11px;color:#727A81;line-height:1.45;margin:14px 2px}
.link-chip-row{display:flex;flex-wrap:wrap;gap:8px}.link-chip{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:9px 12px;font-size:13px;text-align:left}.compact-related{margin-top:8px}.nothing-event{opacity:.72}.nothing-event .calendar-event-title{color:var(--muted)}
</style>
</head>

  const text=await new Response(stream).text();

}

  const dates=calendarEvents.map(e=>e[0]).concat(['2026-12-11']).sort();
  if(dates.length){
   const start=new Date(dates[0]+'T12:00:00'), end=new Date(dates[dates.length-1]+'T12:00:00');
   const existing=new Set(filtered.map(e=>e[0]));
   for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    {const ds=d.toISOString().slice(0,10);if(!existing.has(ds)) filtered.push([ds,'','Nothing today!','nothing']);}
   }
   filtered.sort((a,b)=>a[0].localeCompare(b[0]));
  }
 }
 if(filter==='class'){
  const classDates=calendarEvents.filter(e=>e[3]==='class').map(e=>e[0]).sort();
  if(classDates.length){
   const start=new Date(classDates[0]+'T12:00:00'), end=new Date(classDates[classDates.length-1]+'T12:00:00');
   const existing=new Set(filtered.map(e=>e[0]));
   for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const day=d.getDay();
    if(day!==0&&day!==6){
     const ds=d.toISOString().slice(0,10);
     if(!existing.has(ds)) filtered.push([ds,'','No class','noclass']);
    }
   }
   filtered.sort((a,b)=>a[0].localeCompare(b[0]));
  }
 }
 const grouped={};
 filtered.forEach(e=>{const m=e[0].slice(0,7);(grouped[m]??=[]).push(e)});
 const sections=Object.keys(grouped).map(m=>`<section class="calendar-section"><h3 class="calendar-section-title">${new Date(m+'-15T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3>${grouped[m].map(e=>{const d=fmtDate(e[0]);return `<div class="calendar-event ${e[3]==='noclass'?'no-class-event':''} ${e[3]==='nothing'?'nothing-event':''}"><div class="calendar-date"><div class="calendar-dow">${d.dow}</div><div class="calendar-month">${d.month}</div><div class="calendar-day">${d.day}</div></div><div class="calendar-info"><div class="calendar-event-title">${esc(e[2])}</div>${e[1]?`<div class="calendar-event-meta">${esc(e[1])}</div>`:''}${e[3]!=='noclass'?`<div class="calendar-badge">${esc(e[3])}</div>`:''}</div></div>`}).join('')}</section>`).join('');
 return `<div class="page-header"><div class="page-kicker">School Calendar</div><h2 class="page-title">Fall 2026</h2><p class="page-subtitle">NUR 2129 class schedule, major assessments, and your clinical rotation.</p></div><div class="calendar-toolbar"><button class="calendar-filter ${filter==='all'?'active':''}" data-calfilter="all">ALL</button><button class="calendar-filter ${filter==='class'?'active':''}" data-calfilter="class">CLASS</button><button class="calendar-filter ${filter==='test'?'active':''}" data-calfilter="test">TESTS</button><button class="calendar-filter ${filter==='lab'?'active':''}" data-calfilter="lab">LAB / SIM</button><button class="calendar-filter ${filter==='deadline'?'active':''}" data-calfilter="deadline">DEADLINES</button><button class="calendar-filter ${filter==='clinical'?'active':''}" data-calfilter="clinical">CLINICAL</button></div>${filter==='clinical'?renderClinical():sections}<p class="calendar-note">Class events and dates are transcribed from the provided NUR 2129 Fall 2026 calendar. Clinical entries use only the Austin Ashley row from the provided clinical schedule, with clinical-specific hours and assignment deadlines supplied by you.</p>`;
}

ng>Reference:</strong> ${esc(l.range)}</p></div><div class="diagnostic-detail"><div class="diagnostic-section"><h3>Function / Importance</h3><p>${esc(l.why)}</p></div>${side(l.low,l.id+'-low')}${side(l.high,l.id+'-high')}${medLinks?`<div class="diagnostic-section"><h3>Related Medications</h3><div class="link-chip-row">${medLinks}</div></div>`:''}<div class="diagnostic-section"><h3>Study Tools</h3><div class="action-row" style="margin-top:0"><button class="action-button" data-action="study">STUDY</button><button class="action-button" data-action="quiz">QUIZ ME</button><button class="action-button" data-action="nora">ASK NORA</button></div></div></div>`}

function searchData(){const q=searchInput.value.trim().toLowerCase();if(!q){results.innerHTML='';return}const all=[];
 objectiveData.forEach((topic,si)=>{if((topic.title+' '+topic.references.join(' ')).toLowerCase().includes(q))all.push({type:'topic',si,label:topic.title,detail:`${topic.objectives.length} objectives`});topic.objectives.forEach((o,oi)=>{const hay=(topic.title+' '+o.text+' '+o.subitems.join(' ')+' '+o.courseObjectives).toLowerCase();if(hay.includes(q))all.push({type:'objective',si,oi,label:`Objective ${o.number} · ${topic.title}`,detail:o.text})})});
 Object.values(labData).flat().forEach(l=>{const low=(l.low.label+' '+l.low.info+' '+l.low.risks.join(' ')+' '+l.low.causes.join(' ')+' '+l.low.meds.join(' ')+' '+l.low.care.join(' ')).toLowerCase();const high=(l.high.label+' '+l.high.info+' '+l.high.risks.join(' ')+' '+l.high.causes.join(' ')+' '+l.high.meds.join(' ')+' '+l.high.care.join(' ')).toLowerCase();const base=(l.name+' '+l.abbr+' '+l.range+' '+l.why).toLowerCase();if(base.includes(q))all.push({type:'lab',id:l.id,label:`${l.name}${l.abbr?' ('+l.abbr+')':''}`,detail:l.range});if(low.includes(q))all.push({type:'lab-section',id:l.id,section:'low',label:`${l.low.label} · ${l.name}`,detail:`${l.name} → ${l.low.label}`});if(high.includes(q))all.push({type:'lab-section',id:l.id,section:'high',label:`${l.high.label} · ${l.name}`,detail:`${l.name} → ${l.high.label}`});});
 Object.values(testData).flat().forEach(t=>{if((t.name+' '+t.why+' '+t.prep+' '+t.nursing.join(' ')+' '+t.cautions.join(' ')).toLowerCase().includes(q))all.push({type:'test',id:t.id,label:t.name,detail:t.why})});
 medicationIndex.forEach(m=>{const hay=[m.name,m.brand,m.className,m.indications,m.action,...m.common,...m.adverse,m.contra,...m.precautions,...m.nursing,...m.teaching,...(m.keywords||[])].join(' ').toLowerCase();if(hay.includes(q))all.push({type:'medication',id:m.id,label:m.name,detail:`${m.className}${m.brand?' · '+m.brand:''}`})});
 const cardsFound=Object.entries(sections).filter(([id,x])=>(id+' '+x.title+' '+x.description).toLowerCase().includes(q)).map(([id,x])=>({type:'dashboard',id,label:x.title,detail:x.description}));
 const resultsAll=[...cardsFound,...all].slice(0,40);if(!resultsAll.length){results.innerHTML='<div class="no-results">No results found</div>';return}results.innerHTML=resultsAll.map((r,n)=>`<button class="result" data-search-index="${n}"><span class="result-icon">${r.type==='dashboard'?(icons[r.id]||icons.objectives):r.type==='medication'?icons.medications:r.type==='lab'||r.type==='lab-section'||r.type==='test'?icons.diagnostics:topicIcon()}</span><span class="result-text"><strong>${esc(r.label)}</strong><span>${esc(r.detail)}</span></span></button>`).join('');results.querySelectorAll('.result').forEach((el,i)=>el.addEventListener('click',()=>{const r=resultsAll[i];if(r.type==='dashboard'){closeSearch();if(r.id==='diagnostics')openDiagnostics();else if(r.id==='medications')openMedications();else openPlaceholder(r.id);}else if(r.type==='medication'){closeSearch();openMedications();setTimeout(()=>openMedication(r.id),20)}else if(r.type==='lab'){closeSearch();openDiagnostics('labs');setTimeout(()=>{const g=Object.keys(labData).find(k=>findLab(r.id,k));if(g){nav.push({type:'lab',id:r.id,group:g});setPage(renderLabDetail(findLab(r.id,g)));}},20)}else if(r.type==='lab-section'){closeSearch();openDiagnostics('labs');setTimeout(()=>{const g=Object.keys(labData).find(k=>findLab(r.id,k));if(g){nav.push({type:'lab',id:r.id,group:g});setPage(renderLabDetail(findLab(r.id,g)));setTimeout(()=>document.getElementById(r.id+'-'+r.section)?.scrollIntoView({behavior:'smooth',block:'start'}),30);}},20)}else if(r.type==='test'){closeSearch();openDiagnostics('tests');setTimeout(()=>{const g=Object.keys(testData).find(k=>findTest(r.id,k));if(g){nav.push({type:'test',id:r.id,group:g});setPage(renderTestDetail(findTest(r.id,g)));}},20)}else if(r.type==='topic'){closeSearch();openObjectives();setTimeout(()=>openTopic(r.si),20)}else{closeSearch();openObjectives();setTimeout(()=>{openTopic(r.si);setTimeout(()=>openObjective(r.oi),20)},20)}}))}
searchButton.addEventListener('click',e=>{if(!document.body.classList.contains('searching')){document.body.classList.add('searching');searchInput.focus({preventScroll:true});searchData()}});searchInput.addEventListener('input',searchData);searchCancel.addEventListener('click',e=>{e.stopPropagation();closeSearch()});dimmer.addEventListener('click',closeSearch);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(page.classList.contains('open'))goBack();else if(document.body.classList.contains('searching'))closeSearch()}});
// Native-feeling edge swipe back on touch devices
let swipeStartX=0,swipeStartY=0,swipeTracking=false;page.addEventListener('touchstart',e=>{if(!page.classList.contains('open'))return;const t=e.changedTouches[0];if(t.clientX<=32){swipeStartX=t.clientX;swipeStartY=t.clientY;swipeTracking=true}}, {passive:true});page.addEventListener('touchend',e=>{if(!swipeTracking)return;swipeTracking=false;const t=e.changedTouches[0],dx=t.clientX-swipeStartX,dy=Math.abs(t.clientY-swipeStartY);if(dx>80&&dy<90)goBack()}, {passive:true});
}
init();
</script>
</body></html>
